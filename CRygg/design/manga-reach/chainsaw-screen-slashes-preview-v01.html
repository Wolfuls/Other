<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チェーンソー斬撃プレビュー</title>
<style>body{margin:0;background:#17191d;color:#eee;font-family:sans-serif;display:grid;justify-items:center;gap:16px;padding:24px;box-sizing:border-box}#screen{width:min(80vh,90vw);aspect-ratio:1;background:#000;overflow:hidden}#fx{width:100%;height:100%;background-image:url(chainsaw-screen-slashes-sheet-v01.png);background-size:400% 200%;visibility:hidden}button{padding:12px 28px;font:inherit;cursor:pointer}</style>
<div id="screen"><div id="fx"></div></div><button id="play">再生</button>
<script>
const fx=document.querySelector('#fx');let run=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function play(){const id=++run;fx.style.visibility='hidden';await sleep(600);
const durations=[110,100,90,80,70,60,60,110];
for(let i=0;i<8;i++){if(id!==run)return;fx.style.backgroundPosition=((i%4)/3*100)+'% '+(i<4?0:100)+'%';fx.style.visibility='visible';await sleep(durations[i]);}
if(id!==run)return;await sleep(140);if(id===run)fx.style.visibility='hidden';}
document.querySelector('#play').onclick=play;
</script></html>
