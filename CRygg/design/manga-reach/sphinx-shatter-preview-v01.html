<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スフィンクス崩壊</title><style>body{margin:0;background:#202328;color:white;font-family:sans-serif;display:grid;justify-items:center;gap:16px;padding:20px}#screen{width:min(82vh,92vw);aspect-ratio:1;background:white;overflow:hidden}#fx{width:100%;height:100%;background-image:url(sphinx-shatter-sheet-v01.png);background-size:400% 200%}button{font:inherit;padding:12px 24px}</style><div id="screen"><div id="fx"></div></div><button id="play">再生</button><script>const fx=document.querySelector('#fx');let run=0;async function play(){let id=++run;const times=[600,120,120,140,170,190,230,600];for(let i=0;i<8;i++){if(id!==run)return;fx.style.backgroundPosition=((i%4)/3*100)+'% '+(i<4?0:100)+'%';await new Promise(r=>setTimeout(r,times[i]));}}document.querySelector('#play').onclick=play;</script></html>
