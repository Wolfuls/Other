<div class="option-page-box">
  <div class="option-page-content">
    <h1 i18n="adblocksupport" class="page-title"></h1>
    <h2 i18n="needhelp" class="paragraph-title bottom-line"></h2>
    <div class="section-padding support-text">
      <div i18n="helpcenter" i18n_replacement_el="helpcenter_link">
        <a
          id="helpcenter_link"
          class="link-text-color"
          href="https://helpcenter.getadblock.com/hc/en-us"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
      </div>
    </div>
    <div class="section-padding support-text">
      <div i18n="bugreport" i18n_replacement_el="bugreport">
        <a
          id="bugreport"
          class="link-text-color"
          href="https://helpcenter.getadblock.com/hc/en-us/requests/new"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
      </div>
    </div>
    <div class="section-padding support-text">
      <div i18n="debuginfo" i18n_replacement_el="debuginfo_link">
        <a id="debuginfo_link" class="link-text-color" href="#"></a>
      </div>
    </div>
    <h2 i18n="aboutadblock" class="paragraph-title bottom-line"></h2>
    <div class="section-padding support-text">
      <div i18n="sourcecode" i18n_replacement_el="sourcecode">
        <a
          id="sourcecode"
          class="link-text-color"
          href="https://gitlab.com/eyeo/browser-extensions-and-premium/extensions/extensions/-/tree/main/host/adblock"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
      </div>
    </div>
    <div class="section-padding support-text">
      <div i18n="whatsnew" i18n_replacement_el="whatsnew_link">
        <a id="whatsnew_link" class="link-text-color" href="#"></a>
      </div>
    </div>
    <textarea id="changes" class="widest" style="display: none"></textarea>

    <div class="translation_credits italic do-not-display"></div>

    <div class="extension-state-section">
      <h2 class="paragraph-title bottom-line">Extension State</h2>
      <div id="extension-state" class="extension-state-debug">
        <p>Loading...</p>
      </div>
    </div>
  </div>
</div>
