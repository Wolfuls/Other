function validImage(v){return typeof v==='string'&&/^data:image\/(png|jpeg|webp|gif);base64,[a-zA-Z0-9+/=]+$/.test(v)?v:''}
function validate(s){if(!s||s.version!==1||!s.profile||!Array.isArray(s.threads)||!s.threads.length||!Array.isArray(s.posts)||s.threads.length>200||s.posts.length>2000)throw Error('This is not a valid RatatoskЯ scene.');const str=(v,max=10000)=>String(v??'').slice(0,max);const color=v=>/^#[0-9a-f]{6}$/i.test(v)?v:'#536e62';const person=p=>({name:str(p.name,100)||'Unnamed',handle:str(p.handle,100).replace(/^@/,''),initials:str(p.initials,4)||'?',color:color(p.color),avatar:validImage(p.avatar),verified:!!p.verified});const threads=s.threads.map(t=>({id:str(t.id,100),name:str(t.name,200),description:str(t.description),members:str(t.members,40),following:!!t.following,live:!!t.live}));if(new Set(threads.map(t=>t.id)).size!==threads.length||threads.some(t=>!t.id||!t.name))throw Error('Invalid thread identifiers.');const posts=s.posts.map(p=>({...person(p),id:str(p.id,100),thread:str(p.thread,100),time:str(p.time,100),text:str(p.text),replyTo:str(p.replyTo,100),image:validImage(p.image),replies:num(p.replies),reposts:num(p.reposts),likes:num(p.likes),views:num(p.views),liked:!!p.liked,reposted:!!p.reposted,bookmarked:!!p.bookmarked}));if(new Set(posts.map(p=>p.id)).size!==posts.length||posts.some(p=>!p.id||!threads.some(t=>t.id===p.thread)))throw Error('A post has an invalid thread or identifier.');return{version:1,sceneId:str(s.sceneId,100)||id(),theme:s.theme==='dark'?'dark':'light',feedOnly:!!s.feedOnly,profile:{...person(s.profile),bio:str(s.profile.bio),location:str(s.profile.location,100)},threads,posts}}
function num(n){return Math.max(0,Math.min(999999999,Math.floor(Number(n)||0)))}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{toast('Browser storage is full or unavailable. Use Save HTML to keep your scene.')}}
function commit(){persist();render()}
function remember(){undoState=structuredClone(state)}
function toast(t){$('#toast').textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').textContent='',4200)}
function avatar(p){return `<div class="avatar" style="background:${/^#[a-f0-9]{6}$/i.test(p.color)?p.color:'#536e62'}">${validImage(p.avatar)?`<img src="${p.avatar}" alt="">`:esc(p.initials||p.name.slice(0,2).toUpperCase())}</div>`}
function count(n){return n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1000?(n/1000).toFixed(1).replace('.0','')+'K':n||''}

function postHTML(p){const t=threadById(p.thread);return `<article class="post" data-post="${esc(p.id)}"><div class="post-thread">${icon('threads')}<button data-action="thread" data-id="${esc(t.id)}">${esc(t.name)}</button>${t.live?'<span class="live-tag">LIVE</span>':''}</div><div class="post-row">${avatar(p)}<div class="post-content"><div class="post-meta"><strong>${esc(p.name)}</strong>${p.verified?'<span class="verified" aria-label="Verified">✓</span>':''}<span class="handle">@${esc(p.handle)}</span><span class="muted">· ${esc(p.time)}</span><button class="more studio-only" aria-label="Edit post by ${esc(p.name)}" data-action="edit-post" data-id="${esc(p.id)}">···</button></div>${p.replyTo?`<div class="reply-label">Replying to <span class="green">@${esc(p.replyTo)}</span></div>`:''}<div class="post-text">${esc(p.text).replace(/(^|\s)(#[\p{L}\p{N}_]+)/gu,'$1<span class="tag">$2</span>')}</div>${validImage(p.image)?`<img class="post-image" src="${p.image}" alt="Image attached by ${esc(p.name)}">`:''}<div class="post-actions"><button data-action="reply" data-id="${esc(p.id)}" aria-label="Reply to ${esc(p.name)}">${icon('reply')}${count(p.replies)}</button><button class="${p.reposted?'selected':''}" data-action="repost" data-id="${esc(p.id)}" aria-pressed="${!!p.reposted}" aria-label="Repost by ${esc(p.name)}">${icon('repost')}${count(p.reposts)}</button><button class="${p.liked?'selected':''}" data-action="like" data-id="${esc(p.id)}" aria-pressed="${!!p.liked}" aria-label="Like post by ${esc(p.name)}">${icon('heart')}${count(p.likes)}</button><span class="muted small" style="display:flex;align-items:center;gap:6px">${icon('views')}${count(p.views)}</span><button class="${p.bookmarked?'selected':''}" data-action="bookmark" data-id="${esc(p.id)}" aria-pressed="${!!p.bookmarked}" aria-label="Bookmark post by ${esc(p.name)}">${icon('bookmark')}</button></div></div></div></article>`}
function render(){document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('feed-only',state.feedOnly);$('#nav').innerHTML=[['home','home','Home'],['threads','threads','Explore threads'],['bookmarks','bookmark','Bookmarks'],['profile','user','Profile']].map(([v,i,l])=>`<button class="nav ${view===v?'active':''}" data-action="${v}">${icon(i)}<span>${l}</span></button>`).join('');$('#leftThreads').innerHTML=state.threads.filter(t=>t.following).slice(0,5).map(t=>`<button class="thread-link" data-action="thread" data-id="${esc(t.id)}"><span class="hash">#</span><span>${esc(t.name)}</span></button>`).join('');$('#account').innerHTML=avatar(state.profile)+`<div><strong class="small">${esc(state.profile.name)}</strong><span class="muted small">@${esc(state.profile.handle)}</span></div><span>···</span>`;$('#composeAvatar').innerHTML=avatar(state.profile);const oldThread=$('#quickThread').value;$('#quickThread').innerHTML=state.threads.map(t=>`<option value="${esc(t.id)}"># ${esc(t.name)}</option>`).join('');$('#quickThread').value=threadById(selectedThread)?selectedThread:threadById(oldThread)?oldThread:state.threads[0].id;
const title={home:'Home',all:'Home',threads:'Explore threads',bookmarks:'Bookmarks',profile:state.profile.name,thread:threadById(selectedThread)?.name};$('#pageTitle').textContent=title[view]||'Home';document.title=($('#pageTitle').textContent)+' / RatatoskЯ';$('#pageSubtitle').textContent=view==='home'||view==='all'?'Your corner of Yggdrasil.':view==='bookmarks'?'Saved for another moment.':view==='threads'?'Find your next conversation.':'RatatoskЯ · Yggdrasil';$('#tabs').hidden=!['home','all'].includes(view);$('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.action===view));$('#context').innerHTML=icon('threads')+`<span>${view==='home'?`Following ${state.threads.filter(t=>t.following).length} threads · Latest posts` : view==='all'?'Across Yggdrasil · Latest posts':view==='thread'?'Thread conversation · Latest posts':view==='profile'?'Personal posts & field notes':view==='bookmarks'?'Only you can see your bookmarks':'Conversations from every layer'}</span>`;$('#composer').hidden=['threads','bookmarks'].includes(view);$('#viewBanner').innerHTML=view==='profile'?`<div class="profile-banner">${avatar(state.profile)}<h2>${esc(state.profile.name)}</h2><div class="muted">@${esc(state.profile.handle)}</div><p>${esc(state.profile.bio)}</p><div class="muted small">${esc(state.profile.location)}</div><button class="secondary studio-only" data-action="edit-profile" style="margin-top:16px">Edit profile</button></div>`:view==='thread'?threadBanner(threadById(selectedThread)):'';
const live=state.threads.find(t=>t.live)||state.threads[0];$('#liveTitle').textContent=live.name;$('#liveDescription').textContent=live.description;$('#discover').innerHTML=state.threads.slice(0,5).map(trendHTML).join('');let posts=state.posts.filter(p=>view==='home'?threadById(p.thread)?.following:view==='thread'?p.thread===selectedThread:view==='bookmarks'?p.bookmarked:view==='profile'?p.handle===state.profile.handle:true);if(query)posts=posts.filter(p=>(p.name+' '+p.handle+' '+p.text+' '+threadById(p.thread).name).toLowerCase().includes(query));$('#feed').innerHTML=view==='threads'?`<div style="padding:10px 25px">${state.threads.filter(t=>(t.name+' '+t.description).toLowerCase().includes(query)).map(t=>`<div style="padding:14px 0">${trendHTML(t)}<p class="muted small" style="margin-top:10px">${esc(t.description)}</p></div>`).join('')}<button class="secondary studio-only" data-action="new-thread" style="margin:20px 0">Create a thread</button></div>`:posts.length?posts.map(postHTML).join(''):'<div class="empty"><h2>No posts here yet.</h2><p>Follow a thread or add a post to begin.</p></div>'}
function trendHTML(t){return `<div class="trend"><div class="trend-main"><small>${t.live?'Live conversation':'Community thread'}</small><button data-action="thread" data-id="${esc(t.id)}">${esc(t.name)}</button><small>${esc(t.members)} following</small></div><button class="follow ${t.following?'on':''}" data-action="follow" data-id="${esc(t.id)}" aria-label="${t.following?'Unfollow':'Follow'} ${esc(t.name)}">${t.following?'Following':'Follow'}</button></div>`}
function threadBanner(t){return `<div class="thread-banner"><span class="hash">#</span><h2>${esc(t.name)}</h2><p>${esc(t.description)}</p><button class="follow ${t.following?'on':''}" data-action="follow" data-id="${esc(t.id)}">${t.following?'Following':'Follow thread'}</button><button class="secondary studio-only" data-action="edit-thread" data-id="${esc(t.id)}" style="margin-left:10px">Edit thread</button></div>`}
function openDialog(title,html){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=html;if(!$('#dialog').open)$('#dialog').showModal()}
function closeDialog(){$('#dialog').close()}
function field(label,name,value='',type='text',full=false){return `<label class="field ${full?'full':''}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${['name','handle'].includes(name)?'required maxlength="100"':''}></label>`}
function area(label,name,value){return `<label class="field full">${label}<textarea name="${name}" maxlength="10000">${esc(value)}</textarea></label>`}
function fileField(label,name){return `<label class="field full">${label}<input type="file" name="${name}" accept="image/png,image/jpeg,image/webp,image/gif"></label>`}
async function imageFile(input,previous){const f=input.files[0];if(!f)return previous||'';if(f.size>6*1024*1024)throw Error('Choose an image smaller than 6 MB.');if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type))throw Error('Use a PNG, JPEG, WebP or GIF image.');return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('The image could not be read.'));r.readAsDataURL(f)})}
function editPost(postId,replyId){const existing=state.posts.find(p=>p.id===postId),reply=state.posts.find(p=>p.id===replyId);const p=existing||{...state.profile,id:id(),thread:reply?.thread||selectedThread||$('#quickThread').value||state.threads[0].id,time:'now',text:'',replies:0,reposts:0,likes:0,views:0,replyTo:reply?.handle||''};openDialog(existing?'Edit post':'Create a post',`<form id="postForm"><div class="form-grid">${field('Display name','name',p.name)}${field('Handle','handle',p.handle)}${field('Avatar initials','initials',p.initials)}${field('Avatar color','color',p.color,'color')}${fileField('Avatar image (optional)','avatarFile')}<label class="check full"><input type="checkbox" name="verified" ${p.verified?'checked':''}> Verified badge</label><label class="field">Thread<select name="thread">${state.threads.map(t=>`<option value="${esc(t.id)}" ${t.id===p.thread?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>${field('Timestamp (any text)','time',p.time)}${area('Post text','text',p.text)}${field('Replying to (optional handle)','replyTo',p.replyTo,'text',true)}${fileField('Attached image (optional)','imageFile')}${p.image?'<label class="check"><input type="checkbox" name="removeImage"> Remove attached image</label>':''}${p.avatar?'<label class="check"><input type="checkbox" name="removeAvatar"> Remove avatar image</label>':''}<div class="counts">${['replies','reposts','likes','views'].map(k=>field(k[0].toUpperCase()+k.slice(1),k,p[k]||0,'number')).join('')}</div></div><div class="dialog-actions">${existing?'<button type="button" class="danger secondary" id="deletePost">Delete</button><button type="button" class="secondary" id="moveUp" aria-label="Move post up">↑</button><button type="button" class="secondary" id="moveDown" aria-label="Move post down">↓</button>':''}<button type="button" class="secondary" data-action="close">Cancel</button><button class="primary" type="submit">${existing?'Save changes':'Add post'}</button></div></form>`);const form=$('#postForm');form.onsubmit=async e=>{e.preventDefault();try{const f=new FormData(form),updated={...p,...Object.fromEntries(['name','handle','initials','color','thread','time','text','replyTo'].map(k=>[k,String(f.get(k)||'').trim()])),verified:f.has('verified')};if(!updated.text)throw Error('Write some post text first.');updated.handle=updated.handle.replace(/^@/,'');updated.replyTo=updated.replyTo.replace(/^@/,'');updated.avatar=f.has('removeAvatar')?'':await imageFile(form.elements.avatarFile,p.avatar);updated.image=f.has('removeImage')?'':await imageFile(form.elements.imageFile,p.image);['replies','reposts','likes','views'].forEach(k=>updated[k]=num(f.get(k)));remember();if(existing)state.posts[state.posts.indexOf(existing)]=updated;else{state.posts.unshift(updated);if(reply)reply.replies++;state.threads.find(t=>t.id===updated.thread).following=true;view='thread';selectedThread=updated.thread}commit();closeDialog();toast('Post saved.')}catch(e){toast(e.message)}};if(existing){$('#deletePost').onclick=()=>{remember();state.posts=state.posts.filter(x=>x.id!==p.id);commit();closeDialog();toast('Post deleted. Undo is available in Scene Studio.')};$('#moveUp').onclick=()=>movePost(p.id,-1);$('#moveDown').onclick=()=>movePost(p.id,1)}}
function movePost(pid,delta){const n=state.posts.findIndex(p=>p.id===pid),m=n+delta;if(m<0||m>=state.posts.length)return;remember();[state.posts[n],state.posts[m]]=[state.posts[m],state.posts[n]];commit();toast('Post moved. Save changes to keep any text edits.')}
function editProfile(){const p=state.profile;openDialog('Your character',`<form id="profileForm"><div class="form-grid">${field('Display name','name',p.name)}${field('Handle','handle',p.handle)}${field('Avatar initials','initials',p.initials)}${field('Avatar color','color',p.color,'color')}${fileField('Avatar image (optional)','avatarFile')}${area('Bio','bio',p.bio)}${field('Location','location',p.location,'text',true)}<label class="check full"><input name="verified" type="checkbox" ${p.verified?'checked':''}> Verified badge</label>${p.avatar?'<label class="check full"><input name="removeAvatar" type="checkbox"> Remove avatar image</label>':''}<label class="check full"><input name="updatePosts" type="checkbox" checked> Update existing posts by this character</label></div><div class="dialog-actions"><button class="primary" type="submit">Save character</button></div></form>`);$('#profileForm').onsubmit=async e=>{e.preventDefault();try{const form=e.target,f=new FormData(form),updated={...Object.fromEntries(['name','handle','initials','color','bio','location'].map(k=>[k,String(f.get(k)||'').trim()])),verified:f.has('verified'),avatar:f.has('removeAvatar')?'':await imageFile(form.elements.avatarFile,p.avatar)};updated.handle=updated.handle.replace(/^@/,'');remember();if(f.has('updatePosts'))state.posts.forEach(post=>{if(post.handle===p.handle)Object.assign(post,{name:updated.name,handle:updated.handle,initials:updated.initials,color:updated.color,avatar:updated.avatar,verified:updated.verified})});state.profile=updated;commit();closeDialog();toast('Character saved.')}catch(e){toast(e.message)}}}
function editThread(tid){const existing=threadById(tid),t=existing||{id:id(),name:'',description:'',members:'0',following:true,live:false};openDialog(existing?'Edit thread':'Create a thread',`<form id="threadForm"><div class="form-grid">${field('Thread name','name',t.name,'text',true)}${area('Description','description',t.description)}${field('Follower count (display text)','members',t.members,'text',true)}<label class="check"><input type="checkbox" name="live" ${t.live?'checked':''}> Live conversation</label><label class="check"><input type="checkbox" name="following" ${t.following?'checked':''}> Follow this thread</label></div><div class="dialog-actions"><button type="submit" class="primary">Save thread</button></div></form>`);$('#threadForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);remember();Object.assign(t,{name:f.get('name').trim(),description:f.get('description').trim(),members:f.get('members').trim(),live:f.has('live'),following:f.has('following')});if(!existing)state.threads.push(t);view='thread';selectedThread=t.id;commit();closeDialog()}}
function studio(){openDialog('Scene Studio',`<p class="help">Build your character’s timeline. Everything stays in this browser. The starting accounts and posts are fictional examples, not official setting material.</p><div class="studio-grid"><button data-action="edit-profile"><strong>Your character</strong><span>Name, handle, avatar & bio</span></button><button data-action="new-thread"><strong>Create a thread</strong><span>Community or personal journal</span></button><button data-action="export-json"><strong>Export scene</strong><span>Save an editable JSON backup</span></button><button data-action="import-json"><strong>Import scene</strong><span>Load a previously saved backup</span></button><button data-action="save-html"><strong>Save HTML</strong><span>Portable copy with this scene inside</span></button><button data-action="undo" ${undoState?'':'disabled'}><strong>Undo last edit</strong><span>Restore the previous scene state</span></button></div><label class="check"><input id="feedOnly" type="checkbox" ${state.feedOnly?'checked':''}> Timeline-only layout</label><p class="help" style="margin:14px 0">Screenshot mode hides all scene controls and post edit buttons. Press <strong>Esc</strong> or <strong>F8</strong> to return, or double-click the RatatoskЯ logo. Capture with your device’s screenshot tool. Save HTML preserves the current scene and view.</p><h3 style="margin-top:22px">Your threads</h3>${state.threads.map(t=>`<div class="thread-editor-row"><strong>${esc(t.name)}</strong><button class="secondary" data-action="edit-thread" data-id="${esc(t.id)}">Edit</button></div>`).join('')}<p class="help" style="margin-top:20px">Tip: use the ··· on any post to change its author, text, time, image, counts or order. For an empty scene, remove the sample posts below.</p><div class="dialog-actions"><button class="secondary danger" data-action="clear-posts">Clear all posts…</button><button class="secondary" data-action="reset">Restore sample scene…</button></div>`);$('#feedOnly').onchange=e=>{state.feedOnly=e.target.checked;commit()}}
function captureMode(on){capture=on;document.body.classList.toggle('capture-mode',on);$('#toast').textContent='';if($('#dialog').open)closeDialog()}
function download(name,data,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function saveHTML(){const copy=document.documentElement.cloneNode(true),snapshot={...state,sceneId:id(),initialView:view,initialThread:selectedThread,initialCapture:capture};copy.querySelector('#scene-data').textContent=JSON.stringify(snapshot).replace(/</g,'\\u003c');copy.querySelector('#dialog').removeAttribute('open');copy.querySelector('#dialogBody').innerHTML='';copy.querySelector('#toast').textContent='';copy.querySelector('#quickText').textContent='';download('Ratatoskr-scene.html','<!doctype html>\n'+copy.outerHTML,'text/html;charset=utf-8');toast('Saved a portable HTML copy of your scene.')}
function changeView(v){view=v;query='';$('#search').value='';render();window.scrollTo({top:0,behavior:'instant'})}
function actions(a,i){const p=state.posts.find(x=>x.id===i);switch(a){case'home':case'all':case'threads':case'bookmarks':case'profile':changeView(a);break;case'thread':selectedThread=i;changeView('thread');break;case'live':selectedThread=(state.threads.find(t=>t.live)||state.threads[0]).id;changeView('thread');break;case'follow':remember();threadById(i).following=!threadById(i).following;commit();break;case'theme':state.theme=state.theme==='light'?'dark':'light';commit();break;case'like':case'repost':case'bookmark':{if(!p)return;remember();const key={like:'liked',repost:'reposted',bookmark:'bookmarked'}[a];p[key]=!p[key];if(a!=='bookmark'){const k=a==='like'?'likes':'reposts';p[k]=Math.max(0,num(p[k])+(p[key]?1:-1))}commit();break}case'quick-post':{const text=$('#quickText').value.trim();if(!text)return;remember();const tid=$('#quickThread').value;state.posts.unshift({...state.profile,id:id(),thread:tid,text,time:'now',likes:0,reposts:0,replies:0,views:0});threadById(tid).following=true;$('#quickText').value='';if(view==='thread'&&selectedThread!==tid)selectedThread=tid;commit();break}case'new-post':editPost();break;case'edit-post':editPost(i);break;case'reply':editPost(null,i);break;case'edit-profile':editProfile();break;case'edit-thread':editThread(i);break;case'new-thread':editThread();break;case'studio':studio();break;case'capture':captureMode(true);window.scrollTo(0,0);break;case'close':closeDialog();break;case'save-html':saveHTML();break;case'export-json':download('Ratatoskr-scene.json',JSON.stringify(state,null,2),'application/json');toast('Scene backup exported.');break;case'import-json':$('#importFile').click();break;case'undo':if(undoState){const prior=undoState;undoState=structuredClone(state);state=prior;commit();closeDialog();toast('Previous scene restored.')}break;case'clear-posts':openDialog('Clear all posts?',`<p>Remove every post from this scene? Your character and threads will stay. You can undo this in Scene Studio.</p><div class="dialog-actions"><button class="secondary" data-action="studio">Cancel</button><button class="primary" data-action="confirm-clear">Clear posts</button></div>`);break;case'confirm-clear':remember();state.posts=[];commit();closeDialog();break;case'reset':openDialog('Restore the sample scene?',`<p>This replaces the current scene with the original fictional examples. Export your scene first if you want to keep it.</p><div class="dialog-actions"><button class="secondary" data-action="studio">Cancel</button><button class="primary" data-action="confirm-reset">Restore sample</button></div>`);break;case'confirm-reset':remember();state=structuredClone(defaults);view='home';selectedThread='';commit();closeDialog();break}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)actions(b.dataset.action,b.dataset.id)});$('#closeDialog').onclick=closeDialog;$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
document.addEventListener('keydown',e=>{if(e.key==='F8'){e.preventDefault();captureMode(!capture)}if(e.key==='Escape'&&capture)captureMode(false)});document.querySelectorAll('.brand,.mobile-brand').forEach(el=>el.ondblclick=()=>captureMode(false));$('#search').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>40*1024*1024)throw Error('Scene files must be smaller than 40 MB.');const imported=validate(JSON.parse(await file.text()));remember();state=imported;view='home';selectedThread='';query='';$('#search').value='';commit();closeDialog();toast('Scene imported.')}catch(error){toast('Import failed: '+error.message)}e.target.value=''};
$('#themeButton').innerHTML=icon('moon');$('#searchIcon').innerHTML=icon('search');$('#studioButton').innerHTML=icon('edit')+'<span>Edit scene</span>';$('#addButton').innerHTML=icon('plus')+'<span>Add post</span>';$('#saveButton').innerHTML=icon('save')+'<span>Save HTML</span>';$('#captureButton').innerHTML=icon('camera')+'<span>Screenshot</span>';
if(embedded?.initialView&&['home','all','profile','threads','bookmarks','thread'].includes(embedded.initialView)){view=embedded.initialView;selectedThread=embedded.initialThread||'';if(view==='thread'&&!threadById(selectedThread))view='home'}render();if(embedded?.initialCapture)captureMode(true);
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_ratatoskr_scene',description:'Read the local fictional Ratatoskr scene currently shown in the editor.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:()=>structuredClone(state)})).catch(()=>{})}catch{}}
</script>
</body></html>
