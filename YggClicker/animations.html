<!doctype html><html lang="ja"><meta charset="utf-8"><title>卵が先か鶏が先か — 攻撃プレビュー</title><link rel="stylesheet" href="./duo.css"><style>
body{margin:0;background:#111b20;color:#e3eee8;font:15px system-ui}main{max-width:1250px;margin:24px auto;padding:0 20px}h1{font-size:24px}a{color:#c7e88c}button{background:#273a40;color:#eef7f1;border:1px solid #62837b;padding:10px 15px;margin:4px;cursor:pointer;border-radius:5px}button:hover{background:#466257}.stage{position:relative;height:430px;background:url('./img/poultry-plant-v2.png') center 70%/cover;border:1px solid #59716d;overflow:hidden}.actor{position:absolute;bottom:30px;width:224px;height:224px}.actor .enemy-sprite{display:block;width:100%;height:100%}#eggra{right:180px;z-index:2}#chikira{right:10px;bottom:44px;z-index:1}.target{position:absolute;left:8%;bottom:35px;width:55px;height:85px;border:2px dashed #b4e8df;background:#07353085;display:grid;place-items:center;font-size:12px}.target.second{left:24%}.target.third{left:40%}header{display:flex;justify-content:space-between;align-items:center}p{color:#a6bab6}section{margin-bottom:16px}small{color:#a7b5ad}
</style><main><header><h1>卵が先か鶏が先か</h1><a href="./duo-preview.html">戦闘プレビューへ（保存なし）</a></header><p>中層・畜産プラント / エッグラが左、チキーラが右。連打・双刃投げ・斬撃を更新。</p>
<label>再生速度 <select id="speed"><option value="1">通常</option><option value="0.25">1/4（コマ確認）</option></select></label><div id="stage" data-poultry="true" class="stage"><div class="target">味方A</div><div class="target second">味方B</div><div class="target third">味方C</div><div id="eggra" class="actor"><span class="enemy-sprite"></span></div><div id="chikira" class="actor"><span class="enemy-sprite"></span></div></div>
<section><h2>エッグラ</h2><label>交差斬りのコマ <select id="slash-frame"><option value="">アニメーション</option><option value="0.1">1：頭上でクロス</option><option value="0.27">2：胸元へ下ろす</option><option value="0.41">3：交差斬り</option><option value="0.56">4：振り抜き</option><option value="0.74">5：両腕を戻す</option><option value="0.93">6：構え</option></select></label><br><button data-kind="eggra" data-attack="slash">曲剣斬り［射程1］</button><button data-kind="eggra" data-attack="boomerang">曲剣投げ［射程2〜3］</button><button data-kind="eggra" data-attack="blizzard">吹雪［全体・射程1〜3］</button><button data-kind="eggra" data-attack="ward">防御のおまじない</button><button data-kind="eggra" data-attack="revive">蘇生のおまじない</button><button data-kind="eggra" data-attack="down">エッグラ：ダウン → 起き上がる</button></section>
<section><h2>チキーラ</h2><button data-kind="chikira" data-attack="fists">拳の連打［射程1］</button><button data-kind="chikira" data-attack="boulder">巨大岩［全体・射程1〜3］</button><button data-kind="chikira" data-attack="down">チキーラ：ダウン → 起き上がる</button></section><small>PROTOTYPE 0.75.1 / ゲームのセーブを読み書きしない演出確認ページ</small></main><script src="./js/poultry-scene.js"></script><script src="./js/duo-view.js"></script><script>
document.getElementById('slash-frame').onchange=e=>{document.getElementById('eggra').dataset.previewSlash=e.target.value;};
const timers={};for(const kind of ['chikira','eggra'])YggDuoView.mount(document.getElementById(kind),kind);
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const kind=b.dataset.kind,node=document.getElementById(kind),stage=document.getElementById('stage'),attack=b.dataset.attack;delete node.dataset.previewSlash;document.getElementById('slash-frame').value='';for(const id of timers[kind]||[])clearTimeout(id);stage.querySelectorAll('.duo-effects[data-owner="'+kind+'"]').forEach(n=>n.remove());node.classList.remove('enemy-attacking','duo-down');delete node.dataset.riseUntil;
if(attack==='down'){node.classList.add('duo-down');timers[kind]=[setTimeout(()=>{node.classList.remove('duo-down');node.dataset.riseUntil=String(performance.now()+650);},1700)];return;}
const duration=(['ward','revive'].includes(attack)?4:attack==='blizzard'?3.2:kind==='chikira'?2:1.4)/Number(document.getElementById('speed').value);node.classList.add('enemy-attacking');const layer=YggDuoView.attack(node,{kind:attack,duration},stage,[...stage.querySelectorAll('.target')]);layer.dataset.owner=kind;timers[kind]=[setTimeout(()=>{node.classList.remove('enemy-attacking');YggDuoView.finish(layer);},duration*1000)];});
</script></html>
