<!doctype html><meta charset="utf-8"><title>Timeline Worker regression</title><h1>Worker手番回帰テスト（セーブを読み書きしません）</h1><pre id="result">実行中</pre>
<script src="../js/characters.js"></script><script src="../js/quests.js"></script><script src="../js/data.js"></script><script src="../js/numbers.js"></script><script src="../js/strength.js"></script><script src="../js/combat-effects.js"></script><script src="../js/engine.js"></script><script src="../js/recovery.js"></script>
<script>
(async()=>{try{const E=YggEngine,R=YggRecovery,s=E.createState(1000);s.battleSpeed=2;s.factors=1e16;E.refreshQuestUnlocks(s);for(const id of ['meta','megumin','queen','max']){s.levels[id]=260;s.health[id].hp=E.maxHP(s,YggData.characters.find(c=>c.id===id));}E.togglePerk(s,'max','plot-armor',true);E.setFormation(s,'mohicans',['meta','megumin','max']);E.setFormation(s,'ozmorn',['queen']);E.selectSession(s,'mohicans');s.health.megumin.stunTurns=5;s.actionClock=.37;let done=false,progress=0;const begin=performance.now();const actual=await R.run(E,s,600.7,{seed:431,workerFactory(){const w=new Worker('../js/recovery-worker.js');w.addEventListener('message',e=>{if(e.data.type==='done')done=true;});return w;},progress(){progress++;}});const workerMs=performance.now()-begin;const expected=structuredClone(s);E.advance(expected,600.7,R.seeded(431),false,true);const equal=JSON.stringify(actual)===JSON.stringify(expected);document.getElementById('result').textContent=JSON.stringify({pass:done&&equal,workerCompleted:done,identicalState:equal,progressMessages:progress,workerWallMs:workerMs,turns:actual.timeline.turns,offscreenTurns:actual.sessionStates.ozmorn.timeline.turns},null,2);}catch(e){document.getElementById('result').textContent='FAIL '+e.stack;}})();
</script>
