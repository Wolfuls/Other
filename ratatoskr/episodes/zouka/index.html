.conversation-back{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.conversation-back .earlier-conversation{font-size:12px;color:var(--green)}
.reply-label button{color:var(--green);padding:0;font:inherit;text-align:left}
.reply-label button:hover{text-decoration:underline}
.reply-chain{margin-left:24px;border-left:2px solid var(--line)}
.reply-chain .post{padding-left:18px}
.reply-chain .post-thread{display:none}
.reply-branch>.post{border-bottom:1px solid var(--line)}
.reply-branch>.reply-chain{margin-bottom:8px}
.conversation-link{display:flex;align-items:center;width:100%;padding:8px 5px;gap:10px;text-align:left;border-radius:9px;color:var(--text)}
.conversation-link:hover,.conversation-link.current{background:var(--soft)}
.conversation-link .avatar{width:28px;height:28px;min-width:28px;font-size:10px;flex:0 0 28px}
.conversation-link span{font-size:12px;line-height:1.4;min-width:0;overflow-wrap:anywhere;flex:1}
.conversation-link>svg{width:12px;height:12px;transform:rotate(180deg);color:var(--muted)}
.conversation-guide{padding-bottom:8px}
@media(max-width:700px){.reply-chain{margin-left:10px}.reply-chain .post{padding-left:12px}.conversation-back{gap:4px 16px}}

tar-26","verified":false,"id":"zouka-85","thread":"enmi-fieldnotes","time":"0d · 12:32:10","text":"You do not need to commit to a reply schedule before seeing your doctor.","textJa":"返信の予定まで診察前に確定しなくて大丈夫です。","parentId":"zouka-84","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":1,"likes":10,"views":771,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"camber_line","handle":"camber_line","initials":"C","color":"#404832","avatar":"asset:zouka-avatar-04","verified":false,"replyTo":"camber_line","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":2,"views":241,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life53","thread":"awake-and-chatting","time":"0d · 12:31:47","textJa":"手袋、店で預かってくれてた。取りに行く。","parentId":"zouka-life08","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"The shop had my glove. Going to pick it up."},{"name":"oiltea","handle":"oiltea_machine","initials":"O","color":"#7e785b","avatar":"asset:zouka-avatar-01","verified":false,"id":"zouka-90","thread":"rooms-and-repairs","time":"0d · 12:31:00","text":"Found the charger too.\n\nIt was not behind the washing machine.","textJa":"充電器も見つかりました。\n\n洗濯機の後ろではありませんでした。","parentId":"zouka-52","quoteId":"","replyTo":"mend_by_eight","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":0,"likes":0,"views":234,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-84","thread":"enmi-fieldnotes","time":"0d · 12:29:30","text":"Stepping away for a medical appointment.\n\nI am aware that questions remain unanswered. I shall read them on my return.\n\nI have no confirmed figure for the total number of Artificial Flowers. Any answer to a question premised on their number will require that qualification.","textJa":"診察のため離席する。\n\n未回答の質問があることは把握している。戻ってから読む。\n\n造花の総数について、私が確認している数字はない。人数を前提にした質問には、その点を留保して答えることになる。","parentId":"","quoteId":"","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":114,"likes":319,"views":18609,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Repairs Until Eight","handle":"mend_by_eight","initials":"RU","color":"#725a4c","avatar":"asset:zouka-avatar-06","verified":false,"replyTo":"smallbone_t","quoteExcerpt":"","replies":0,"quotes":0,"reposts":1,"likes":4,"views":563,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily38","thread":"rooms-and-repairs","time":"0d · 12:28:27","textJa":"大丈夫です。八時まで開けてます。","parentId":"zouka-daily32","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"That's fine. We're open until eight."},{"name":"Eamon Quay","handle":"eamon_quay","initials":"EQ","color":"#866955","avatar":"asset:zouka-avatar-24","verified":false,"id":"zouka-89","thread":"enmi-fieldnotes","time":"0d · 12:28:00","text":"I have read your reply.\n\nI agree that the loss should be acknowledged. But requiring an organisation making a necessary decision in the current circumstances to justify it fully before the outcome is known risks making decisions on the ground difficult in themselves.\n\nIt seems we still disagree on that point.","textJa":"返答を読みました。\n\n損失があることを認めるべきだという点には賛成します。ただ、現在の状況で必要な判断をした組織に、結果が出る前からその判断を十分に説明できることまで求めると、現場で決めること自体が難しくなると思っています。\n\nこの点はまだ意見が違うようです。","parentId":"zouka-47","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":0,"likes":13,"views":2222,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"thread":"midgard-neighborhood","parentId":"zouka-tb29","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":40,"views":3177,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-tb30","time":"0d · 12:27:48","textJa":"見物はご自由に。\n\nただ、君が私について書いたことは、君の発言として残る。「見ているだけ」と添えればその説明をしなくてよいのなら、成程、なかなか便利な立場だね。\n\n私の「個人の意見」にも、そこまでの効能は求めていなかったよ。","text":"You are welcome to watch.\n\nBut what you have written about me remains your own statement. If adding 'just watching' relieves you of having to account for it, I see: that is a remarkably convenient position.\n\nI had not asked nearly so much of my 'personal opinion.'"},{"name":"古いケーブル","handle":"old_cable_h","initials":"古","color":"#6a422f","avatar":"asset:zouka-avatar-11","verified":false,"replyTo":"worn_socket","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":12,"views":375,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life52","thread":"helheim-daily","time":"0d · 12:27:16","textJa":"いい。来る前に一言くれ。","parentId":"zouka-life51","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Fine. Give me a shout before you come."},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"thread":"midgard-neighborhood","parentId":"","quoteId":"zouka-tb28","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":43,"views":1320,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-tb29","time":"0d · 12:26:05","textJa":"長い長いｗ\n\nこっちは「個人の見解」を便利に使ってる先生を眺めてるだけなんで。\n\nそんなに判定してほしいなら、どっかに査読でも頼んできたら？","text":"Too long lol\n\nI'm just watching a professor make convenient use of 'personal opinion.'\n\nIf you need a verdict that badly, go get yourself peer-reviewed or something."},{"name":"window warm","handle":"window_warm","initials":"WW","color":"#533b29","avatar":"asset:zouka-avatar-25","verified":false,"replyTo":"sana_belkacem","quoteExcerpt":"","replies":0,"quotes":0,"reposts":9,"likes":30,"views":713,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor17","thread":"midgard-neighborhood","time":"0d · 12:25:34","textJa":"確認された話じゃないのは分かりました。ありがとう。\n\nでも、帰ってきた家族の手を見ようとか考えた自分が嫌になる。今度こそ閉じます。","parentId":"zouka-rumor12","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"I understand it hasn't been confirmed. Thank you.\n\nBut I hate that I even thought of checking my family's hands when they get home. I'm really closing this now."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"thread":"midgard-neighborhood","parentId":"zouka-tb27","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":1,"reposts":1,"likes":30,"views":2691,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-tb28","time":"0d · 12:24:10","textJa":"ええ。その危険も承知して述べている、と先ほど答えた。その影響への批判を「個人だから」と退けてもいない。\n\n君が、そういう立場の学者がこの判断を公に述べること自体を有害だと考えるなら、それは私の立場への反対になる。そのまま述べたまえ。\n\n私を批判するために、私が主張してもいない免責まで用意してくれる必要はないよ。そこまでのお気遣いは無用だ。","text":"Yes. As I have already said, I am speaking in awareness of that danger. Nor have I dismissed criticism of the consequences by calling my opinion personal.\n\nIf you consider it harmful for a scholar in my position to express this judgement publicly at all, that is an objection to my position. You may state it as such.\n\nYou need not supply me with an immunity I never claimed in order to criticise me. There is no need to be quite so considerate."},{"name":"little receipt","handle":"little_receipt","initials":"LR","color":"#d5735c","avatar":"asset:zouka-avatar-31","verified":false,"id":"zouka-88","thread":"midgard-neighborhood","time":"0d · 12:24:00","text":"Something round.\n\nCame out to buy thread just now and bought eggs again.","textJa":"丸いものです。\n\nさっき糸を買いに来て、また卵を買いました。","parentId":"zouka-87","quoteId":"","replyTo":"luz_turns_pages","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":11,"views":1272,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"rounds after","handle":"rounds_after","initials":"RA","color":"#723f52","avatar":"asset:zouka-avatar-20","verified":false,"replyTo":"rounds_after","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":9,"views":318,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily37","thread":"midgard-neighborhood","time":"0d · 12:23:32","textJa":"妹が持ってないそうなので一冊送る。\n\nついでに貸したままの前の巻も返してもらう。","parentId":"zouka-daily24","quoteId":"","q -avatar-10","verified":false,"replyTo":"rashid_mansur","quoteExcerpt":"","replies":0,"quotes":0,"reposts":1,"likes":17,"views":638,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life50","thread":"midgard-neighborhood","time":"0d · 12:17:56","textJa":"閉まる時間を一時間間違えていました。今日は覗くだけになりそうです。","parentId":"zouka-life31","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"I had the closing time wrong by an hour. Looks like I'll only have time for a quick look today."},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"thread":"midgard-neighborhood","parentId":"zouka-tb24","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":34,"views":2716,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-tb25","time":"0d · 12:17:55","textJa":"はいはい、最初から全部説明してましたね。\n\n個人の意見ですって後から足したんでしょ？　そっちの書き足しを、こっちが読んでなかったことにしないでくれる？","text":"Yes yes, you explained absolutely everything from the beginning.\n\nExcept you added the personal-opinion bit later, didn't you? Don't make your addendum into something I failed to read."},{"name":"lemon wire","handle":"lemon_wire","initials":"LW","color":"#5a7a6c","avatar":"asset:zouka-avatar-19","verified":false,"replyTo":"axiom_lad","quoteExcerpt":"","replies":1,"quotes":0,"reposts":3,"likes":57,"views":3040,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor15","thread":"midgard-neighborhood","time":"0d · 12:17:09","textJa":"さっき「赤い血見せれば一瞬」って言ってたのお前だろ。","parentId":"zouka-rumor14","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"you're the one who just said showing red blood would settle it in a second"},{"name":"violet_pad","handle":"violet_pad","initials":"V","color":"#2d2b81","avatar":"asset:zouka-avatar-09","verified":false,"replyTo":"","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":19,"views":87,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily35","thread":"late-night-matches","time":"0d · 12:16:28","textJa":"今夜の観戦、音声なしでも大丈夫です。名前の後ろに「聞くだけ」って付けといてもらえると助かる。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"You can spectate tonight without voice chat. Adding 'listening only' after your name would help."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"thread":"midgard-neighborhood","parentId":"zouka-tb23","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":2,"likes":63,"views":1362,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-tb24","time":"0d · 12:15:40","textJa":"おやおや。読んでいるよ。その説明によって、私が何を取り下げたと君が考えているのかを聞いている。\n\n所属を表示していることも、専門家としての発言が重く読まれることも認めている。「個人の意見」と説明したことで、その二つが消えるとは述べていない。\n\n「君は看板を使っている」という指摘には、初めから同意しているのだがね。何度も確認してくれるとは、几帳面な人だ。","text":"My, my. I have read it. I am asking what you believe I withdrew by making that clarification.\n\nI acknowledge both that I display my affiliation and that a specialist's statements carry weight. I have not said that calling an opinion 'personal' makes either of those things disappear.\n\nI have agreed from the beginning with your observation that I am using my credentials. How painstaking of you to check so many times."},{"name":"AXIOM","handle":"axiom_lad","initials":"A","color":"#1c4578","avatar":"asset:zouka-avatar-35","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":3,"likes":10,"views":2709,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor14","thread":"midgard-neighborhood","time":"0d · 12:14:33","textJa":"赤いから絶対安全って思い込むな、って話だろ。\n\n確認もしてないのに否定する方が危ないわ。","parentId":"","quoteId":"zouka-rumor12","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"The point is not to assume red means absolutely safe.\n\nDismissing it without checking is more dangerous."},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"thread":"midgard-neighborhood","parentId":"zouka-tb14","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":3,"likes":14,"views":1468,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-tb23","time":"0d · 12:13:22","textJa":"だから、その看板で注目集めておいて、揉めたら「個人です」って話だろｗ\n\nそこまで一緒に読んでもらえます？","text":"Yes, that's the point. Get attention with the credentials, then say 'it's personal' when things kick off lol\n\nCould you read that part too?"},{"name":"Mira Sol","handle":"mira_at_night","initials":"MS","color":"#715d55","avatar":"asset:zouka-avatar-32","verified":false,"replyTo":"","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":13,"views":369,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily34","thread":"helheim-daily","time":"0d · 12:12:37","textJa":"弁当の箸を忘れて、引き出しの奥にあった予備に助けられた。\n\n入れたの去年の私だと思う。えらい。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Forgot my lunch chopsticks. The spare pair at the back of the drawer saved me.\n\nPretty sure last year's me put them there. Well done, me."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-tb14","thread":"midgard-neighborhood","time":"0d · 12:11:49","text":"'Could you read the context before coming at me?' Quite. I thoroughly agree. Let us apply that to what you say about me as well.\n\nMy affiliation has been displayed from the outset, and I have never denied speaking as a specialist. This morning, you yourself introduced me with 'A Flamel researcher. Posting under his real name.'\n\nUp to that point, your account and mine agree.","textJa":"「文脈読んでから絡んでくれません？」か。結構、実に賛成だ。では、私についてもそうしてもらおう。\n\n所属は最初から表示しているし、専門家として発言していることも否定していない。朝には君自身が「これ、フラメルの研究者が実名で書いてるからな」と紹介してくれていたはずだ。\n\n君の説明と私の説明は、そこまでは一致しているよ。","parentId":"","quoteId":"zouka-tb32","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":4,"likes":22,"views":3034,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Marta Seidel","handle":"marta_seidel","initials":"MS","color":"#70594a","avatar":"asset:zouka-avatar-26","verified":false,"replyTo":"marta_seidel","quoteExcerpt":"","replies":0,"quotes":0,"reposts":1,"likes":19,"views":344,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life49","thread":"awake-and-chatting","time":"0d · 12:11:35","textJa":"会議、結局端末越しになりました。朝から歩いた分は運動に数えます。","parentId":"zouka-life36","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"The meeting ended up being online. I'm counting this morning's walking as exercise."},{"name":"Tinderbox","handle":"feed_wick"," ighborhood","time":"0d · 11:58:24","textJa":"テセウスさんこっちです","parentId":"","quoteId":"zouka-prov04","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Theseus, this one right here"},{"name":"camber_line","handle":"camber_line","initials":"C","color":"#404832","avatar":"asset:zouka-avatar-04","verified":false,"replyTo":"lemon_wire","quoteExcerpt":"","replies":0,"quotes":0,"reposts":3,"likes":29,"views":1664,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor09","thread":"midgard-neighborhood","time":"0d · 11:57:04","textJa":"いるって断言してない。いないとは言い切れないでしょって話。","parentId":"zouka-rumor08","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"I'm not saying they definitely exist. I'm saying you can't rule them out."},{"name":"Talia Reed","handle":"talia_reed","initials":"TR","color":"#765c4b","avatar":"asset:zouka-avatar-16","verified":false,"id":"zouka-a44","thread":"enmi-fieldnotes","time":"0d · 11:56:00","text":"I haven’t forgotten that you incorporated my point.\n\nIt’s the “you, too” that was unnecessary. Does having helped you mean I should keep quiet about how you behave afterwards?","textJa":"採用してもらったことを忘れているわけではありません。\n\nその「君まで」が余計だという話です。先生を手伝った側なら、その後の態度には黙っていろということですか。","parentId":"zouka-a43","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":23,"views":863,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Oren Bell","handle":"oren_bell","initials":"OB","color":"#c3bd93","avatar":"asset:zouka-avatar-28","verified":false,"id":"zouka-80","thread":"enmi-fieldnotes","time":"0d · 11:56:00","text":"Yes.\n\nBut thinking about how someone unable to formulate such a careful objection would be treated, I’m still frightened.","textJa":"そうですね。\n\nただ、対象になる人がそこまで整理して反論できない場合にも、同じように扱われるのかと思うと、私はやっぱり怖いです。","parentId":"zouka-78","quoteId":"","replyTo":"paperless_bird","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":3,"likes":10,"views":345,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"id":"zouka-tb08","thread":"midgard-neighborhood","time":"0d · 11:55:02","text":"So you admit you used the credentials to say it.\n\nCould’ve just said that from the start. Took the scenic route, didn’t we?","textJa":"じゃあ看板使って言ったのは認めるんだ。\n\n最初からそう書けばよかったのに。随分遠回りしましたねえ。","parentId":"zouka-tb07","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":4,"likes":71,"views":1989,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"lemon wire","handle":"lemon_wire","initials":"LW","color":"#5a7a6c","avatar":"asset:zouka-avatar-19","verified":false,"replyTo":"camber_line","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":29,"views":1372,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor08","thread":"midgard-neighborhood","time":"0d · 11:54:46","textJa":"その話、どこで出たの。","parentId":"zouka-rumor07","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Where did that come from?"},{"name":"folkpond","handle":"folkpond","initials":"F","color":"#344d4a","avatar":"asset:zouka-avatar-29","verified":false,"replyTo":"sparrowtube","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":21,"views":553,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily31","thread":"midgard-neighborhood","time":"0d · 11:54:12","textJa":"名前の後ろに再結成した年が入ってる方。昔の曲はまだ上がってない。新曲だけ。","parentId":"zouka-daily30","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"The one with the reunion year after the name. None of the old songs are up yet. Just the new one."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-a43","thread":"enmi-fieldnotes","time":"0d · 11:53:00","text":"I am referring to those who explicitly announced that they would not read it.\n\nThe post incorporating your observation should be just above. Are you, too, going to conflate the two?","textJa":"「読まない」と自分で宣言した者について述べている。\n\n君の指摘を採用した投稿も、すぐ上にあるはずだ。君までその二つを混ぜるのかね。","parentId":"zouka-a41","quoteId":"","replyTo":"talia_reed","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":3,"likes":23,"views":569,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"camber_line","handle":"camber_line","initials":"C","color":"#404832","avatar":"asset:zouka-avatar-04","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":1,"reposts":3,"likes":33,"views":1668,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor07","thread":"midgard-neighborhood","time":"0d · 11:52:29","textJa":"赤い血見せろって、赤い血が出る造花はいないの？\n\n元の実験体と造花でそんなに違うって話なら、造花同士でも違いがあるかもしれないじゃん。","parentId":"","quoteId":"zouka-rumor03","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"All this 'show red blood' stuff. Are there no Artificial Flowers that bleed red?\n\nIf the original specimen and the Flowers can be that different, couldn't the Flowers differ from one another too?"},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-79","thread":"enmi-fieldnotes","time":"0d · 11:52:00","text":"Yes.\n\nA product of a non-reproducible emergence followed by unknown modifications cannot be treated as a finished manufacturing technology.\n\nEven in pursuing the responsibility of a research institution, one must distinguish what it actually researched, what it knew, and what escaped its custody.","textJa":"ええ。\n\n再現性のない発生と、未知の改造を経た産物を、完成した製造技術として扱うことはできない。\n\n研究機関への責任追及を行うのであっても、実際に何を研究し、何を把握し、何を流出させたのかを分ける必要がある。","parentId":"zouka-76","quoteId":"","replyTo":"sana_belkacem","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":0,"likes":1,"views":534,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"bent spoon","handle":"bent_spoon_jpg","initials":"BS","color":"#753469","avatar":"asset:zouka-avatar-34","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":1,"likes":18,"views":608,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life46","thread":"awake-and-chatting","time":"0d · 11:51:34","textJa":"辛さ「普通」で頼んだのに普通じゃない。\n\n店の人が平然と同じの食ってる。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Asked for 'normal' spice. This is not normal.\n\nThe person working here is eating the same thing without blinking."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-tb07","thread":"midgard-neighborhood","time":"0d · 11:51:08","text":"Yes. It may be read as a specialist's judgement and invoked by those who support the killings. I am speaking in full awareness of that effect. 'Personal opinion' is not a phrase that invalidates criticism of it.\n\nI had assumed you understood all this already when you began.","textJa":"ええ。専門家の発言として読まれ、殺害を支持する側にも援用されうる。その影響も承知した上で述べている。『個人の意見』は、それへの批判を無効にする言葉ではない。\n\n私はてっきり、もう全部お分かりの上で話しているのかと思っていたよ。","parentId":"zouka-tb06","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":0,"likes":35,"views":2475,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"AXIOM","handle":"axiom_lad","initials":"A","color":"#1c4578","avatar":"asset:zouka-avatar-35","verified":false,"replyTo":"peripheral_zero","quoteExcerpt":"","replies":0,"quotes":0,"reposts":9,"likes":33,"views":1256,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor06","thread":"helheim-daily","time":"0d · 11:50:36","textJa":"横から増えてきたｗ\n\n庇う側がこんだけ必死なの、逆に分かりやすいんだよな。","parentId":"zouka-rumor05","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"More of them jumping in lol\n\nHonestly, the way their defenders are panicking makes it pretty obvious."},{"name":"inklong","handle":"inklong_88","initials":"I","color":"#81777a","avatar":"asset:zouka-avatar-21","verified":false,"id":"zouka-a42","thread":"enmi-fieldnotes","time":"0d · 11:50:00","text":"It’s not an objection. I’m telling you I don’t fucking like you.\n\nNeed that spelled out too? What happened to your reading comprehension?","textJa":"反論じゃなくて、お前が嫌いって話してんだよ。\n\nそこまで説明しないと分からないの？　読解力どうした？","parentId":"zouka-a39","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":0,"likes":14,"views":342,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"sparrowtube","handle":"sparrowtube","initials":"S","color":"#c3baa6","avatar":"asset:zouka-avatar-12","verified":false,"replyTo":"folkpond","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":1,"views":151,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily30","thread":"midgard-neighborhood","time":"0d · 11:49:33","textJa":"配信どこ？　同名の別バンドばかり出る。","parentId":"zouka-daily15","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Where's it streaming? I keep finding other bands with the same name."},{"name":"paperless bird","handle":"paperless_bird","initials":"PB","color":"#7e6e63","avatar":"asset:zouka-avatar-27","verified":false,"id":"zouka-78","thread":"enmi-fieldnotes","time":"0d · 11:48:00","text":"To me, “I wouldn’t exempt myself” just removes the accusation of double standards. It settles nothing about whether the claim is right.\n\nHis answer already accounts for that, which makes it all the more necessary to find another ground for objecting.","textJa":"私は「自分も例外にしない」と言われると、その人を二重基準だと批判できなくなるだけで、主張が正しいかどうかは何も決まらないと思います。\n\n先生の返答はそこまで含めて答えてるので、余計に別のところから反対しないといけない。","parentId":"zouka-59","quoteId":"","replyTo":"oren_bell","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":20,"views":1399,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"peripheral zero","handle":"peripheral_zero","initials":"PZ","color":"#25313c","avatar":"asset:zouka-avatar-22","verified":false,"replyTo":"axiom_lad","quoteExcerpt":"","replies":1,"quotes":0,"reposts":7,"likes":44,"views":1945,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor05","thread":"helheim-daily","time":"0d · 11:47:39","textJa":"俺も対処は必要だと思ってるけど、お前に身分の判定してもらう気はないわ。","parentId":"zouka-rumor03","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"I think action is necessary too, but I'm not having you decide what I am."},{"name":"Talia Reed","handle":"talia_reed","initials":"TR","color":"#765c4b","avatar":"asset:zouka-avatar-16","verified":false,"id":"zouka-a41","thread":"enmi-fieldnotes","time":"0d · 11:47:00","text":"Some people have read it and disagree.\n\nThis feels like it also sweeps in people who can only manage a few words or cannot explain themselves well. Not everyone reading knows who you’re angry with.","textJa":"読んで反対している人もいます。\n\n短い言葉でしか返せない人や、うまく説明できない人まで、そちらにまとめられているように感じます。先生が誰に腹を立てているか、読んでいる全員が分かるわけではありません。","parentId":"zouka-a40","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":5,"views":1879,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"id":"zouka-tb06","thread":"midgard-neighborhood","time":"0d · 11:46:37","text":"All right, one question.\n\nYou say ‘sometimes you kill innocent people’ under your real name and affiliation, then it causes a stir and it’s ‘my personal opinion.’ You know what effect that has out there, don’t you? You knew when you wrote it.","textJa":"じゃあ一個だけ。\n\n『無実でも殺すことはある』って実名と所属つきで言って、騒ぎになったら『個人です』。それで世間にどんな効果が出るか、先生なら分かって書いてるんでしょ？","parentId":"zouka-tb03","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":0,"likes":58,"views":1570,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Mira Sol","handle":"mira_at_night","initials":"MS","color":"#715d55","avatar":"asset:zouka-avatar-32","verified":false,"replyTo":"axiom_lad","quoteExcerpt":"","replies":0,"quotes":0,"reposts":5,"likes":13,"views":752,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor04","thread":"helheim-daily","time":"0d · 11:46:05","textJa":"知らん奴に血を見せる趣味はない。気持ち悪い。","parentId":"zouka-rumor03","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Showing my blood to random strangers isn't a hobby of mine. Creep."},{"name":"Sora Dispatch","handle":"sora_loading","initials":"SD","color":"#6e5b53","avatar":"asset:zouka-avatar-05","verified":false,"replyTo":"sora_loading","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":8,"views":421,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily29","thread":"helheim-daily","time":"0d · 11:45:52","textJa":"容器の持ち主見つかった。レンズ豆だって。名前も書いてもらった。","parentId":"zouka-daily18","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Found the container's owner. Lentils, apparently. They put their name on it too."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"replyTo":"axiom_lad","quoteExcerpt":"","replies":0,"quotes":0,"reposts":15,"likes":18,"views":3442,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov18","thread":"midgard-neighborhood","time":"0d · 11:45:29","textJa":"私が尋ねているのは、君の基準に従った時、どこで逮捕が終わるのかということだよ。\n\n君を満足させない者を順に造花へ数えていけば、さぞ大きな事件に見えるだろうね。捜査の前から、これほど成果が上がるとは。","parentId":"zouka-prov17","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"What I am asking is where, by your criterion, the arrests end.\n\nIf you count everyone who fails to satisfy you as an Artificial Flower, it must look like quite an extensive case. Such impressive results, before the investigation has even begun."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-tb17","thread":"midgard-neighborhood","time":"0d · 11:44:25","text":"How kind of you to invite everyone.\n\nDo feel free to ask your own question as well. Would you be more comfortable if I waited for a larger audience?","textJa":"皆に声を掛けてくれるとは、親切だね。\n\n君の質問も、遠慮せずにどうぞ。人が増えるまで待ってあげた方がよいのかな。","parentId":"zouka-tb04","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":3,"likes":63,"views":2013,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"little receipt","handle":"little_receipt","initials":"LR","color":"#d5735c","avatar":"asset:zouka-avatar-31","verified":false,"id":"zouka-77","thread":"midgard-neighborhood","time":"0d · 11:44:00","text":"Probably mine.\n\nBought the eggs. Forgot the thread.","textJa":"たぶん私です。\n\n卵は買いました。糸は忘れました。","parentId":"zouka-68","quoteId":"","replyTo":"luz_turns_pages","quoteExcerpt":"","quoteExcerptJa":"","replies":2,"quotes":0,"reposts":1,"likes":27,"views":563,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"folkpond","handle":"folkpond","initials":"F","color":"#344d4a","avatar":"asset:zouka-avatar-29","verified":false,"replyTo":"nessa_six","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":16,"views":688,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life45","thread":"awake-and-chatting","time":"0d · 11:43:53","textJa":"年額にしなくてよかった。","parentId":"zouka-life40","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Glad I didn't pay for a year."},{"name":"AXIOM","handle":"axiom_lad","initials":"A","color":"#1c4578","avatar":"asset:zouka-avatar-35","verified":false,"replyTo":"mira_at_night","quoteExcerpt":"","replies":2,"quotes":1,"reposts":7,"likes":19,"views":1074,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor03","thread":"helheim-daily","time":"0d · 11:43:26","textJa":"じゃあ赤い血見せれば？　できるなら一瞬で済む話だろ。","parentId":"zouka-rumor02","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Then show us some red blood? If you can, this takes about a second."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-a40","thread":"enmi-fieldnotes","time":"0d · 11:43:00","text":"I have received quite enough reports of “I have no intention of reading it, but I have an opinion.”\n\nIt is possible to dislike me without reading what I write, but surely that activity does not require summoning me as well.","textJa":"「読む気はないが意見はある」という報告は、もう十分に受け取った。\n\n文章を読まずに私を嫌うことは可能だが、その作業にまで私を呼び出す必要はないだろう。","parentId":"","quoteId":"","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":2,"quotes":0,"reposts":115,"likes":280,"views":24070,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"rounds after","handle":"rounds_after","initials":"RA","color":"#723f52","avatar":"asset:zouka-avatar-20","verified":false,"id":"zouka-tb05","thread":"midgard-neighborhood","time":"0d · 11:42:11","text":"What I disagreed with Enmi about is written just above.\n\nDon't turn criticism of you into agreement with him.","textJa":"私が遠見先生の何に反対していたか、すぐ上に書いてあるよ。\n\nあなたへの批判を、先生への賛同に変えないで。","parentId":"zouka-a38","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":1,"likes":17,"views":1536,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-a39","thread":"enmi-fieldnotes","time":"0d · 11:41:00","text":"There is no need to force yourself to write until an objection occurs to you.","textJa":"反論が思いつくまで、無理に書かなくてよい。","parentId":"zouka-a35","quoteId":"","replyTo":"inklong_88","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":3,"likes":37,"views":1041,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Sana Belkacem","handle":"sana_belkacem","initials":"SB","color":"#686874","avatar":"asset:zouka-avatar-17","verified":false,"id":"zouka-76","thread":"enmi-fieldnotes","time":"0d · 11:41:00","text":"Thank you. That clarifies the scope of your sources.\n\nAt least the public account does not establish that Flamel can simply produce more of the same at any time. That point seems to require an explanation of its own.","textJa":"ありがとうございます。参照範囲は分かりました。\n\n少なくとも「フラメルが同じものをいつでも追加生産できる」という理解は、公表内容からは導けませんね。その点は別件で説明する必要がありそうです。","parentId":"zouka-34","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":3,"likes":14,"views":393,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Mira Sol","handle":"mira_at_night","initials":"MS","color":"#715d55","avatar":"asset:zouka-avatar-32","verified":false,"replyTo":"axiom_lad","quoteExcerpt":"","replies":1,"quotes":0,"reposts":8,"likes":48,"views":811,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor02","thread":"helheim-daily","time":"0d · 11:40:16","textJa":"じゃあお前の意見に賛成するまで、私は人間に戻れないわけ？","parentId":"zouka-rumor01","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"So I don't get to be human again until I agree with you?"},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"id":"zouka-tb04","thread":"midgard-neighborhood","time":"0d · 11:40:09","text":"Questions invited by the man himself.\n\nApplicants will also be assessed on their reading comprehension. No examination fee.","textJa":"ご本人から直々に質問募集です。\n\nなお質問者の読解力も審査されます。受験料は無料。","parentId":"","quoteId":"zouka-tb03","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":5,"likes":45,"views":1638,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-tb03","thread":"midgard-neighborhood","time":"0d · 11:39:24","text":"Oh, taking an interest in my institution as well? How attentive.\n\nLet us hear your own question first. It would be a shame to trouble so many people with something I can attend to myself.","textJa":"おや、所属先のことまで気に掛けてくれるとは、まめな人だ。\n\nまずは君自身の質問を聞こう。私一人で済む用事に、大勢の手を煩わせるのも申し訳ないからね。","parentId":"zouka-tb02","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":1,"reposts":0,"likes":16,"views":2325,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"AXIOM","handle":"axiom_lad","initials":"A","color":"#1c4578","avatar":"asset:zouka-avatar-35","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":3,"likes":42,"views":2533,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-rumor01","thread":"helheim-daily","time":"0d · 11:38:50","textJa":"造花の味方をするやつは造花なんだろ。\n\n同類が処分されるのが嫌なんだと思えば全部納得するわ。","parentId":"","quoteId":"zouka-75","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Anyone siding with Artificial Flowers is probably one themselves.\n\nIt all makes sense once you realise they just don't want their own kind disposed of."},{"name":"inklong","handle":"inklong_88","initials":"I","color":"#81777a","avatar":"asset:zouka-avatar-21","verified":false,"replyTo":"","quoteExcerpt":"","replies":0,"quotes":0,"reposts":1,"likes":9,"views":509,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily28","thread":"midgard-neighborhood","time":"0d · 11:38:07","textJa":"買った覚えのない服が届いた。注文履歴にあった。\n\n寝る前に買い物するのやめたい。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Clothes arrived that I don't remember buying. They're in my order history.\n\nI need to stop shopping before bed."},{"name":"Mira Sol","handle":"mira_at_night","initials":"MS","color":"#715d55","avatar":"asset:zouka-avatar-32","verified":false,"id":"zouka-75","thread":"helheim-daily","time":"0d · 11:37:00","text":"I understand that choosing protection carries risks too.\n\nBut some of the people being killed live here as well. I don’t think you can neatly separate “people of the Lower Layer” from “things that bring danger into it.”\n\nThat’s what bothers me.","textJa":"保護する判断にも危険があるのは分かる。\n\nでも、殺される側もここで暮らしている場合がある。「下層の人間」と「危険を持ち込むもの」を、きれいに分けられる話ではないと思う。\n\n私が引っかかってるのはそこ。","parentId":"zouka-60","quoteId":"","replyTo":"old_cable_h","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":1,"reposts":2,"likes":27,"views":744,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"id":"zouka-tb02","thread":"midgard-neighborhood","time":"0d · 11:36:42","text":"Oh, the man himself lol\n\nPlenty of time to count people defending you, then. But mention your employer and suddenly it’s personal views, was it?","textJa":"あ、ご本人だｗ\n\n自分をかばった人を数えて遊ぶ余裕はあるんですね。所属先の話になると急に個人の見解でしたっけ。","parentId":"zouka-tb01","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":0,"likes":14,"views":1225,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Talia Reed","handle":"talia_reed","initials":"TR","color":"#765c4b","avatar":"asset:zouka-avatar-16","verified":false,"replyTo":"luz_turns_pages","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":8,"views":91,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life44","thread":"midgard-neighborhood","time":"0d · 11:36:26","textJa":"ありがとうございます。少し遅れるかもしれませんが、伺います。","parentId":"zouka-life38","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Thank you. I may be a little late, but I'll be there."},{"name":"AXIOM","handle":"axiom_lad","initials":"A","color":"#1c4578","avatar":"asset:zouka-avatar-35","verified":false,"replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","replies":1,"quotes":0,"reposts":3,"likes":53,"views":1494,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov17","thread":"midgard-neighborhood","time":"0d · 11:35:41","textJa":"そういう揚げ足取りしてる間に何か起きたらどうするんですか？\n\n上に立つ人間には止める責任があるでしょう。","parentId":"zouka-prov16","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"What if something happens while you're busy nitpicking?\n\nPeople in power have a responsibility to stop it."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-74","thread":"enmi-fieldnotes","time":"0d · 11:34:00","text":"Correct. Making the legal qualification explicit does not amount to withdrawing my political premises.\n\nThe material on which to oppose those premises remains in the original post. I made no particular attempt to conceal it.","textJa":"その通りだ。法的な留保を明記したからといって、私の政治的な前提まで撤回したわけではない。\n\nその前提に反対するための材料は、元の投稿にも残っている。特に隠して書いたつもりはない。","parentId":"zouka-67","quoteId":"","replyTo":"rashid_mansur","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":0,"likes":12,"views":910,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-tb01","thread":"midgard-neighborhood","time":"0d · 11:33:18","text":"Oh, how generous. You are counting even my critics among my supporters.\n\nAt this rate, I shall have to conclude that today's reception has been rather favourable.","textJa":"ほう、気前のよいことだね。私を批判していた人まで、こちらの味方に数えてくれる。\n\n君がその調子なら、今日はなかなか好評ということになりそうだ。","parentId":"zouka-a38","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":4,"likes":66,"views":2784,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"古いケーブル","handle":"old_cable_h","initials":"古","color":"#6a422f","avatar":"asset:zouka-avatar-11","verified":false,"replyTo":"worn_socket","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":13,"views":447,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily27","thread":"helheim-daily","time":"0d · 11:32:18","textJa":"ある。底だけテープ張り直して持ってけ。","parentId":"zouka-daily25","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Got them. Retape the bottoms before you take them."},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"id":"zouka-a38","thread":"midgard-neighborhood","time":"0d · 11:31:00","text":"The professor’s legal team just keeps growing.\n\nMust be rough working for free.","textJa":"先生の顧問弁護士、どんどん増えるな。\n\n無給で大変ですね。","parentId":"zouka-a37","quoteId":"","replyTo":"rounds_after","quoteExcerpt":"","quoteExcerptJa":"","replies":2,"quotes":0,"reposts":3,"likes":9,"views":445,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"peripheral zero","handle":"peripheral_zero","initials":"PZ","color":"#25313c","avatar":"asset:zouka-avatar-22","verified":false,"id":"zouka-73","thread":"enmi-fieldnotes","time":"0d · 11:31:00","text":"By that logic, someone upstairs demanding protection is also having a say in the risks people downstairs take.\n\nI don’t want either of them to shut up. Just don’t pretend the floor number settles it.","textJa":"そこまで言うなら、上層にいる人が保護しろと言う時も、下層で引き受ける危険に意見を出してることになる。\n\nどっちも黙れとは思わない。階層だけで答えが出たことにしないでほしい。","parentId":"zouka-72","quoteId":"","replyTo":"third_landing","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":35,"views":668,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"peripheral zero","handle":"peripheral_zero","initials":"PZ","color":"#25313c","avatar":"asset:zouka-avatar-22","verified":false,"replyTo":"","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":8,"views":703,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life43","thread":"helheim-daily","time":"0d · 11:29:07","textJa":"誰か靴用の乾燥機貸してくれ。昼に戻れるなら寄りたい。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Anyone got a shoe dryer I can borrow? Could stop by if I can get back at lunchtime."},{"name":"third landing","handle":"third_landing","initials":"TL","color":"#96825e","avatar":"asset:zouka-avatar-39","verified":false,"id":"zouka-72","thread":"enmi-fieldnotes","time":"0d · 11:29:00","text":"Fine, people downstairs agree too.\n\nStill doesn’t give the professor upstairs a reason to stake other people’s lives on his judgement.","textJa":"下層にも賛成する人がいるのは分かった。\n\nそれで、上層にいる先生が自分の判断に他人の命を乗せていい理由にはならないと思う。","parentId":"zouka-30","quoteId":"","replyTo":"peripheral_zero","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":36,"views":415,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"rounds after","handle":"rounds_after","initials":"RA","color":"#723f52","avatar":"asset:zouka-avatar-20","verified":false,"id":"zouka-a37","thread":"midgard-neighborhood","time":"0d · 11:28:00","text":"The readers asked him to clarify that.\n\nIf he doesn’t, he’s being evasive; if he does, he’s running away. What are you trying to establish? I raised the weight of his credentials, but this isn’t what I was after.","textJa":"その説明を書けって言ったのは読者側だよ。\n\n書かなければ曖昧にしてる、書いたら逃げた、じゃ何を確認したいのか分からない。私は肩書の重さを問題にしてたけど、こういうことがしたかったわけじゃない。","parentId":"zouka-a36","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":9,"views":867,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"replyTo":"axiom_lad","quoteExcerpt":"","replies":1,"quotes":0,"reposts":3,"likes":95,"views":4801,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov16","thread":"midgard-neighborhood","time":"0d · 11:27:19","textJa":"成程。保護運動を止めない者まで造花に数えるのか。\n\nハールバルズ氏を逮捕しないＹＤＦも、その基準なら造花になりそうだが。その場合、次は誰を呼ぶつもりかね。","parentId":"zouka-prov15","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"I see. Even those who fail to stop the protection movement count as Artificial Flowers.\n\nBy that standard, a YDF that fails to arrest Mr Harbards would seem to qualify too. Whom will you call next, in that case?"},{"name":"little receipt","handle":"little_receipt","initials":"LR","color":"#d5735c","avatar":"asset:zouka-avatar-31","verified":false,"replyTo":"little_receipt","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":15,"views":603,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily26","thread":"rooms-and-repairs","time":"0d · 11:26:35","textJa":"針はありました。糸もありました。全部黒。","parentId":"zouka-daily12","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Found needles. Found thread too. All black."},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"id":"zouka-a36","thread":"midgard-neighborhood","time":"0d · 11:25:00","text":"And here comes “personal views.”\n\nCredentials for the publicity.\nPrivate citizen for the fallout.\n\nConvenient.","textJa":"個人の見解きました。\n\n肩書は看板。\n揉めたら個人。\n\n便利ですね。","parentId":"","quoteId":"zouka-70","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":10,"likes":7,"views":2268,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Marta Seidel","handle":"marta_seidel","initials":"MS","color":"#70594a","avatar":"asset:zouka-avatar-26","verified":false,"id":"zouka-71","thread":"enmi-fieldnotes","time":"0d · 11:25:00","text":"Thank you.\n\nI distinguish the clarification of your position from agreement with the content. My thanks concern making the former readily available.","textJa":"ありがとうございます。\n\n立場の説明と、内容に賛同するかどうかは別に考えています。まず確認できる形になったことについて。","parentId":"zouka-70","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":39,"views":1556,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-70","thread":"enmi-fieldnotes","time":"0d · 11:22:00","text":"To state separately the capacity in which I am speaking:\n\nThese posts express my personal opinions, based on publicly available materials. They are not official positions of Hermes, Flamel, or any other affiliated or associated institution.\n\nI am not involved in the research concerned. Nor am I invoking unpublished knowledge about the control mechanism of the Artificial Flowers or the conditions required to confine them.\n\nThe grounds for judgements I offer as a specialist are themselves open to criticism. Explaining that an opinion is personal does not mean withdrawing responsibility for expressing it.\n\nFollowing Ms Seidel’s observation, I have made this a separate post.","textJa":"発言の立場について、まとめて明示する。\n\n一連の投稿は、公表された資料に基づく私個人の意見であり、ヘルメス、フラメル、その他の所属・関係機関の公式見解ではない。\n\n私は当該研究の担当者ではなく、造花の操作機構や収容条件について、非公開の知見を根拠として提示しているものでもない。\n\n専門家として述べた判断については、その論拠も批判の対象になる。個人の意見であるという説明によって、発言への責任を取り下げるつもりはない。\n\nザイデル氏の指摘を受け、この点を独立した投稿とした。","parentId":"","quoteId":"","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":1,"reposts":29,"likes":394,"views":13584,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Oren Bell","handle":"oren_bell","initials":"OB","color":"#c3bd93","avatar":"asset:zouka-avatar-28","verified":false,"replyTo":"window_warm","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":7,"views":775,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life42","thread":"awake-and-chatting","time":"0d · 11:21:33","textJa":"見つかりました、ありがとう。知らない歌手だったので他の曲も聴いてみます。","parentId":"zouka-life26","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Found it, thank you. I hadn't heard of the singer, so I'll try some other songs too."},{"name":"worn socket","handle":"worn_socket","initials":"WS","color":"#71765a","avatar":"asset:zouka-avatar-14","verified":false,"replyTo":"old_cable_h","quoteExcerpt":"","replies":1,"quotes":0,"reposts":2,"likes":21,"views":384,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily25","thread":"helheim-daily","time":"0d · 11:20:44","textJa":"欲しい。大きいの二つあれば。昼過ぎ取りに行く。","parentId":"zouka-daily19","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Me. Two big ones, if you've got them. I'll come by after noon."},{"name":"Civic Rights Forum","handle":"civic_status","initials":"CR","color":"#354f56","avatar":"asset:zouka-avatar-23","verified":true,"id":"zouka-69","thread":"nibelung-report","time":"0d · 11:18:00","text":"We have received the response to our statement.\n\nA responsibility for security should not be used to dismiss objections to the methods currently employed.\n\nWe cannot accept a requirement that a civic organisation calling for alternatives must first possess its own confinement facilities and security apparatus.","textJa":"声明への回答は確認しました。\n\n警備上の責任があることをもって、現在の手段への異議が退けられるべきではないと考えます。\n\n代替措置の検討を求める市民団体が、まず収容施設と警備体制を自ら保有しなければならない、という条件には同意できません。","parentId":"zouka-62","quoteId":"","replyTo":"Nibelung_Report","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":5,"views":1468,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"AXIOM","handle":"axiom_lad","initials":"A","color":"#1c4578","avatar":"asset:zouka-avatar-35","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":7,"likes":15,"views":2282,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov15","thread":"midgard-neighborhood","time":"0d · 11:17:09","textJa":"造花とかいう危険物を保護する運動を停止させないアレク・ハールバルズは名誉造花だからYDFは早くこいつを捕まえるべき。","parentId":"","quoteId":"zouka-36","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Alec Harbards won't stop the movement protecting those dangerous objects they call Artificial Flowers, so he's an honorary Flower and the YDF should hurry up and arrest him."},{"name":"Luz Ortega","handle":"luz_turns_pages","initials":"LO","color":"#866149","avatar":"asset:zouka-avatar-30","verified":false,"id":"zouka-68","thread":"midgard-neighborhood","time":"0d · 11:16:00","text":"Lunchtime story reading will go ahead as scheduled.\n\nWe have a shopping list left inside a returned book at reception. The one that says “eggs, thread, something sweet.”","textJa":"昼の読み聞かせは予定通りです。\n\n返却本に挟まっていた買い物メモは受付で預かっています。「卵、糸、何か甘いもの」と書いてある方。","parentId":"","quoteId":"","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":7,"likes":33,"views":1031,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"rounds after","handle":"rounds_after","initials":"RA","color":"#723f52","avatar":"asset:zouka-avatar-20","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":2,"likes":2,"views":207,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily24","thread":"midgard-neighborhood","time":"0d · 11:15:18","textJa":"昨日届いた小説、同じ巻を持ってた。\n\n表紙が変わってたんだよ……。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"The novel that arrived yesterday is a volume I already own.\n\nThey changed the cover, okay…"},{"name":"inklong","handle":"inklong_88","initials":"I","color":"#81777a","avatar":"asset:zouka-avatar-21","verified":false,"replyTo":"inklong_88","quoteExcerpt":"","replies":0,"quotes":0,"reposts":1,"likes":14,"views":74,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life41","thread":"awake-and-chatting","time":"0d · 11:14:26","textJa":"寝癖やっと直った。午前の用事はだいたい終わってる。","parentId":"zouka-life12","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Finally fixed my bed hair. Most of the morning's errands are over."},{"name":"Rashid Mansur","handle":"rashid_mansur","initials":"RM","color":"#6e5b4e","avatar":"asset:zouka-avatar-10","verified":false,"id":"zouka-67","thread":"enmi-fieldnotes","time":"0d · 11:14:00","text":"I have read the addition.\n\nYour reservation on legality and the effect of publicly stating that killing may be permissible as policy remain separate matters. The legal qualification does not remove grounds for criticising the latter.","textJa":"追補は確認しました。\n\nなお、適法性を判断していないことと、政策として殺害を許容しうると公に述べることの影響は、それぞれ残ると思います。法的な留保があれば後者への批判が解消する、という意味ではありません。","parentId":"zouka-65","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":0,"views":2267,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"inklong","handle":"inklong_88","initials":"I","color":"#81777a","avatar":"asset:zouka-avatar-21","verified":false,"id":"zouka-a35","thread":"enmi-fieldnotes","time":"0d · 11:13:00","text":"Guess he thinks adding “thank you for your observation” makes him look like a respectable scholar.\n\nAll he’s doing is politely organising the conditions for killing people.","textJa":"最後に「ご指摘ありがとうございました」を足せば、まともな学者に見えると思ってそう。\n\n人を殺していい条件を上品に整理してるだけなのに。","parentId":"zouka-65","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":2,"likes":3,"views":1684,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Jun & Pepper","handle":"pepper_has_chair","initials":"J&","color":"#6f6457","avatar":"asset:zouka-avatar-03","verified":false,"replyTo":"pepper_has_chair","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":15,"views":457,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily23","thread":"midgard-neighborhood","time":"0d · 11:12:26","textJa":"会議終わった。椅子に戻ったらペッパーは箱の方へ移動した。\n\nしばらく箱でお願いします。","parentId":"zouka-55","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Meeting over. I went back to the chair and Pepper moved into the box.\n\nPlease stay in the box for a while."},{"name":"rounds after","handle":"rounds_after","initials":"RA","color":"#723f52","avatar":"asset:zouka-avatar-20","verified":false,"id":"zouka-66","thread":"midgard-neighborhood","time":"0d · 11:11:00","text":"Right, I’m not trying to declare it official policy.\n\nI mean he’s posting from a position where it won’t read like some random person’s opinion. Getting attention as a researcher, then being a private citizen only when there’s trouble, wouldn’t wash with me.","textJa":"そう、組織の方針だと決めつけたいわけじゃなくて。\n\n「その辺の人の意見」と同じ重さでは読まれない立場で書いてる、ということ。研究者の肩書で注目されて、問題になった時だけ私人です、だと通らないと思う。","parentId":"zouka-50","quoteId":"","replyTo":"carmine_sleeve","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":0,"likes":25,"views":1622,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Mira Sol","handle":"mira_at_night","initials":"MS","color":"#715d55","avatar":"asset:zouka-avatar-32","verified":false,"id":"zouka-a34","thread":"helheim-daily","time":"0d · 11:09:00","text":"I didn’t call you a dog.\n\nStop supplying your own insults and barking at them.","textJa":"犬なんて言ってない。\n\n自分で悪口を用意して、自分で吠えないで。","parentId":"zouka-a33","quoteId":"","replyTo":"old_cable_h","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":0,"likes":19,"views":1506,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-65","thread":"enmi-fieldnotes","time":"0d · 11:08:00","text":"An addition to my earlier post.\n\nAs Ms Reed pointed out, my account of the ways information might be lost concentrated on concealment by individuals who know their origin.\n\nWhere an individual is unaware of that origin, enquiries by family or others around them may lead to discovery. If such enquiries are understood to lead directly to that person’s death, there is a reason to avoid seeking confirmation at all. It was insufficient to consider only deliberate concealment by the person concerned.\n\nFollowing my exchange with Mr Mansur, I should also state explicitly that distinguishing an individual’s criminal responsibility from the response to a danger does not exclude the latter from legal examination. I have offered no judgement on the legality of the current killings.\n\nThe deterrent effect of demonstrating the capacity to govern the Lower Layer also merits examination. Where that is included among the aims, however, a burden is imposed on the individual for a reason distinct from removing the danger that particular individual presents. That distinction must also be maintained.","textJa":"先の投稿に追補する。\n\nリード氏の指摘の通り、私は情報が得られなくなる経路を、由来を知った個体の潜伏に寄せて記述していた。\n\n本人が由来を知らない場合、家族や周囲の者による相談が、発見の端緒となりうる。その相談が当人の殺害へ直結すると理解されれば、確認自体を避ける理由が生じる。本人の意思による潜伏だけを想定するのは不十分だった。\n\nまた、マンシュール氏との応酬を踏まえて明記しておく。個体の刑事責任と危険への対処を区別することは、後者を法的な検討から除外することを意味しない。私は現在の処分について、適法性の判断を示していない。\n\n下層の統治能力を周囲に示すという抑止効果も、検討すべきものだろう。ただし、それを目的に含める場合には、当該個体の危険を除くこととは別の理由で、その個体へ負担を課していることになる。この区別も維持する必要がある。","parentId":"","quoteId":"","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":2,"quotes":0,"reposts":126,"likes":411,"views":22801,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Nessa","handle":"nessa_six","initials":"N","color":"#725c4b","avatar":"asset:zouka-avatar-08","verified":false,"replyTo":"folkpond","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":0,"views":145,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life40","thread":"awake-and-chatting","time":"0d · 11:07:38","textJa":"天かす。","parentId":"zouka-life34","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Batter crumbs."},{"name":"古いケーブル","handle":"old_cable_h","initials":"古","color":"#6a422f","avatar":"asset:zouka-avatar-11","verified":false,"id":"zouka-a33","thread":"helheim-daily","time":"0d · 11:06:00","text":"You’re the one snapping at people.\n\nCall me Theseus’s dog, whatever you like. I’ll take the side that actually shows up when trouble starts. A statement isn’t going to stand outside my shop.","textJa":"噛みついてんのはお前だろ。\n\nテセウスの犬とでも何とでも言えよ。いざ揉めた時に来てくれる方を俺は選ぶ。声明文は店の前に立ってくれないからな。","parentId":"zouka-a04","quoteId":"","replyTo":"mira_at_night","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":2,"likes":19,"views":1300,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"paperless bird","handle":"paperless_bird","initials":"PB","color":"#7e6e63","avatar":"asset:zouka-avatar-27","verified":false,"replyTo":"","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":12,"views":421,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily22","thread":"rooms-and-repairs","time":"0d · 11:05:39","textJa":"隣の部屋の人、歌詞が分からない所だけ声量が倍になる。\n\nこっちも正しい歌詞を覚えられない。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"The neighbour only doubles the volume for the lyrics they don't know.\n\nI'm not learning the right words either."},{"name":"worn socket","handle":"worn_socket","initials":"WS","color":"#71765a","avatar":"asset:zouka-avatar-14","verified":false,"id":"zouka-64","thread":"helheim-daily","time":"0d · 11:04:00","text":"So nothing changes.\n\nWe get an article talking back to the people asking for change, but still no idea when we can move around normally again.","textJa":"結局変わらないのか。\n\n変えろって言ってた人に言い返す記事は出るけど、こっちがいつ普通に通れるようになるのかは分からないまま。","parentId":"","quoteId":"zouka-62","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":1,"likes":39,"views":631,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"AXIOM","handle":"axiom_lad","initials":"A","color":"#1c4578","avatar":"asset:zouka-avatar-35","verified":false,"id":"zouka-a32","thread":"enmi-fieldnotes","time":"0d · 11:03:00","text":"Cut people off like that and you lose their respect even when you’re right.\n\nShouldn’t have bothered defending you.","textJa":"そうやって人を切ってるから、内容が正しくても人望がなくなるんですよ。\n\n擁護しようと思って損した。","parentId":"zouka-a22","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":8,"views":1540,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-v10-02","time":"0d · 11:02:36","thread":"midgard-neighborhood","textJa":"ほう。法理学と刑法理論を修め、犯罪心理学へ進んだ人間が、犯罪に多少明るいと。よいところに気付いたね。\n\n私の勉強の動機まで考えてくれるとは、ありがたいことだ。何を勉強してきたかを確かめる前に、そこまで気を回してくれるとは思わなかったよ。","text":"Oh. Someone who studied jurisprudence and criminal-law theory before moving into criminal psychology knows a little about crime. How observant of you.\n\nGood of you to think about my motives for studying, too. I had not expected you to give them so much thought before checking what it was I studied.","parentId":"zouka-prov09","quoteId":"","replyTo":"paper_comet","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":9,"likes":138,"views":3150,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"folkpond","handle":"folkpond","initials":"F","color":"#344d4a","avatar":"asset:zouka-avatar-29","verified":false,"id":"zouka-63","thread":"nibelung-report","time":"0d · 11:02:00","text":"I get asking if there’s an alternative.\n\nBut isn’t it weird if that becomes “only people who can implement one themselves may object”?","textJa":"対案があるか聞くのは分かる。\n\nでも、対案を自分で実施できる人しか方針に反対できない、まで行くと変じゃない？","parentId":"zouka-62","quoteId":"","replyTo":"Nibelung_Report","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":35,"views":348,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"NIBELUNG REPORT","handle":"Nibelung_Report","initials":"NR","color":"#d52c90","avatar":"asset:nibelung","verified":true,"id":"zouka-62","thread":"nibelung-report","time":"0d · 11:00:00","text":"THESEUS RESPONDS TO CIVIC RIGHTS FORUM STATEMENT\n\nTheseus has stated that it will not change its current policy in response to the Civic Rights Forum’s call to end blanket killings.\n\n“Until a practicable means of management is presented, we cannot entrust the safety of Lower Layer residents to unverified possibilities,” it said.\n\nIt also demanded that organisations calling for isolation and protection identify concrete management measures and the party responsible for implementing them.\n\n“Given our responsibility for safety in the Lower Layer, demands from outside our jurisdiction alone will not halt our response.”","textJa":"【テセウス、市民権フォーラムの声明に回答】\n\nテセウスは、一律殺害方針の撤回を求めた市民権フォーラムの声明に対し、現行方針を変更しないと回答しました。\n\n「実行可能な管理方法が示されていない段階で、下層住民の安全を未確認の可能性に委ねることはできない」としています。\n\nまた、隔離・保護を求める団体に対し、具体的な管理手段と、それを実施する責任主体を示すよう要求しました。\n\n「下層の安全を預かる責任がある以上、管轄外からの要求だけで対応を止めることはない」と説明しています。","parentId":"","quoteId":"zouka-36","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":2,"quotes":1,"reposts":56,"likes":461,"views":13351,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":true,"liked":false,"reposted":false,"bookmarked":false},{"name":"Jun & Pepper","handle":"pepper_has_chair","initials":"J&","color":"#6f6457","avatar":"asset:zouka-avatar-03","verified":false,"replyTo":"mend_by_eight","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":6,"views":277,"expanded":
