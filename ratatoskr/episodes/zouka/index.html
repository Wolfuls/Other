her side too. What have I been looking at all this time?"},{"name":"Luz Ortega","handle":"luz_turns_pages","initials":"LO","color":"#866149","avatar":"asset:zouka-avatar-30","verified":false,"replyTo":"talia_reed","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":15,"views":355,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life38","thread":"midgard-neighborhood","time":"0d · 10:50:19","textJa":"正午からです。予約はいりません。少し遅れても大丈夫ですよ。","parentId":"zouka-life33","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"It starts at noon. No booking needed. It's fine if you're a little late."},{"name":"Oren Bell","handle":"oren_bell","initials":"OB","color":"#c3bd93","avatar":"asset:zouka-avatar-28","verified":false,"id":"zouka-59","thread":"enmi-fieldnotes","time":"0d · 10:50:00","text":"Some people will think applying it to yourself makes you trustworthy. Others will think it makes you even harder to stop.\n\nI’m in the latter group.","textJa":"自分にも適用する人だから信用できる、という人と、自分にも適用する人だから余計に止めにくい、という人に分かれそう。\n\n私は後者です。","parentId":"zouka-58","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":0,"likes":0,"views":718,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"save slot 0","handle":"save_slot_zero","initials":"S0","color":"#679c83","avatar":"asset:zouka-avatar-37","verified":false,"id":"zouka-a29","thread":"enmi-fieldnotes","time":"0d · 10:49:00","text":"Yeah yeah, look how cool I am, so hard on myself too.\n\nHow old are you? Grow out of the edgy teenager phase already lmao","textJa":"はいはい、自分にも厳しい俺かっこいい。\n\n歳いくつだよ、中二病はいい加減卒業しとけｗ","parentId":"zouka-58","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":8,"views":415,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"古いケーブル","handle":"old_cable_h","initials":"古","color":"#6a422f","avatar":"asset:zouka-avatar-11","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":2,"likes":4,"views":492,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily19","thread":"helheim-daily","time":"0d · 10:48:22","textJa":"店の裏に置いてた空き箱、欲しいって言ってた人いるか。閉店までなら取っとく。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Who was asking for the empty boxes behind my shop? I'll hold them until closing."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-58","thread":"enmi-fieldnotes","time":"0d · 10:47:00","text":"I would be afraid, and I would look for a way to survive. I am not confident that I could wait calmly.\n\nBut I could not demand that I alone be exempted from the same criteria because I do not wish to die.\n\nI am not saying that this should persuade anyone else. I am answering the question about my own treatment.","textJa":"恐れるだろうし、助かる方法も探すだろう。冷静に待っていられるという自信はない。\n\nただ、私が死にたくないという理由で、同じ判断基準から私だけを除外せよとは主張できない。\n\nそれで他の者も納得すべきだと述べているわけではないよ。私自身の扱いについての質問に答えている。","parentId":"zouka-54","quoteId":"","replyTo":"paperless_bird","quoteExcerpt":"","quoteExcerptJa":"","replies":2,"quotes":0,"reposts":0,"likes":22,"views":502,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-v10-01","time":"0d · 10:46:36","thread":"rooms-and-repairs","textJa":"何よりだ。私の方は、返事をもらうほど調子がよくなるので心配無用だよ。","text":"Glad to hear it. As for me, I get into better form with every reply, so there is no need to worry.","parentId":"zouka-a27","quoteId":"","replyTo":"oiltea_machine","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":9,"likes":64,"views":3150,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Repairs Until Eight","handle":"mend_by_eight","initials":"RU","color":"#725a4c","avatar":"asset:zouka-avatar-06","verified":false,"id":"zouka-a28","thread":"rooms-and-repairs","time":"0d · 10:46:00","text":"We don’t service humans.","textJa":"人間の方は対応していません。","parentId":"zouka-a27","quoteId":"","replyTo":"oiltea_machine","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":3,"likes":3,"views":1157,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-57","thread":"enmi-fieldnotes","time":"0d · 10:45:00","text":"I would incorporate that point. My account concentrated too much on the behaviour of individuals who know their origin.\n\nWhere those around them avoid enquiries or seeking advice, information leading to discovery is lost even if the person is not deliberately hiding. That needs to be included in evaluating the effectiveness of the sweep.","textJa":"その指摘は採用したい。私は、自分の由来を知った個体の行動に記述を寄せすぎていた。\n\n周囲の人間が確認や相談を避ける場合、本人が意識して潜伏していなくとも、発見に至る情報は失われる。掃討の効果を評価する上でも、含める必要がある。","parentId":"zouka-49","quoteId":"","replyTo":"talia_reed","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":3,"likes":27,"views":525,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-56","thread":"enmi-fieldnotes","time":"0d · 10:44:00","text":"A fair point. I shall state separately that this is personal commentary based on public materials.\n\nI should not have assumed that displaying my affiliation would always adequately convey the capacity in which I am speaking.","textJa":"もっともだ。公表資料に基づく個人の論評であることは、まとめて明示しておく。\n\n所属を表示しているだけで、どの立場の発言かが常に十分に伝わると考えるべきではなかったね。","parentId":"zouka-51","quoteId":"","replyTo":"marta_seidel","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":11,"views":1936,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"oiltea","handle":"oiltea_machine","initials":"O","color":"#7e785b","avatar":"asset:zouka-avatar-01","verified":false,"id":"zouka-a27","thread":"rooms-and-repairs","time":"0d · 10:43:00","text":"This man has been arguing from when my washing machine started acting up right through to getting it fixed.\n\nThe washing machine settled down first.","textJa":"この人、うちの洗濯機が暴れ始めてから直るまで、ずっと人と揉めてる。\n\n洗濯機の方が先に落ち着いた。","parentId":"","quoteId":"enmi-luna-assessment","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":2,"quotes":0,"reposts":9,"likes":1,"views":1960,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"replyTo":"latch_17","quoteExcerpt":"","replies":0,"quotes":1,"reposts":15,"likes":75,"views":4424,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov08","thread":"enmi-fieldnotes","time":"0d · 10:42:58","textJa":"その影響への批判なら受けよう。私は、自分の発言が他人の判断に利用されうることを否定していない。\n\nただ、君は今、殺人幇助で私を捕まえるべきだと書いた。その根拠を聞いている。\n\n君が私を嫌っていることには、これ以上の立証は要らないよ。そこはもう、十分に伝わっている。","parentId":"zouka-prov07","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"I will accept criticism of that effect. I have not denied that my statements may be used in other people's decisions.\n\nBut you wrote that I should be arrested for aiding and abetting murder. I am asking for the grounds of that claim.\n\nYour dislike of me requires no further proof. You have already made that perfectly clear."},{"name":"Smallbone","handle":"smallbone_t","initials":"S","color":"#d6cdb9","avatar":"asset:zouka-avatar-18","verified":false,"replyTo":"sora_loading","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":5,"views":262,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life37","thread":"awake-and-chatting","time":"0d · 10:42:37","textJa":"今やっと朝の雑談まで追いついた。休憩終わる。","parentId":"zouka-life01","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Just caught up with the morning chat. Break's over."},{"name":"Jun & Pepper","handle":"pepper_has_chair","initials":"J&","color":"#6f6457","avatar":"asset:zouka-avatar-03","verified":false,"id":"zouka-55","thread":"midgard-neighborhood","time":"0d · 10:42:00","text":"Put both chairs side by side. Cat fell asleep between them.\n\nI’m on the floor.","textJa":"椅子を二脚並べたら、間で寝た。\n\n私は床。","parentId":"","quoteId":"","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":11,"likes":28,"views":1482,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Mira Sol","handle":"mira_at_night","initials":"MS","color":"#715d55","avatar":"asset:zouka-avatar-32","verified":false,"id":"zouka-a26","thread":"midgard-neighborhood","time":"0d · 10:41:00","text":"You literally wrote “liven things up.”\n\nDon’t start pretending you’re concerned about ordinary enquiries now.","textJa":"「賑やかになりそう」って自分で書いてるだろ。\n\n今さら普通の問い合わせを心配してる人の顔をするなよ。","parentId":"zouka-a25","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":29,"views":1300,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Sora Dispatch","handle":"sora_loading","initials":"SD","color":"#6e5b53","avatar":"asset:zouka-avatar-05","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":2,"likes":9,"views":300,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily18","thread":"helheim-daily","time":"0d · 10:40:51","textJa":"休憩室の冷蔵庫、名前のない容器がある。豆っぽいものが入ってる。\n\n心当たりある人、今日中に名前書いといて。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"There's an unlabelled container in the break-room fridge. Something that looks like beans in it.\n\nIf it's yours, put your name on it today."},{"name":"paperless bird","handle":"paperless_bird","initials":"PB","color":"#7e6e63","avatar":"asset:zouka-avatar-27","verified":false,"id":"zouka-54","thread":"enmi-fieldnotes","time":"0d · 10:40:00","text":"Would you accept the decision if you were the one facing death under the same conditions?\n\nThough I’m not sure simply saying you’d make no exception for yourself settles anything either.","textJa":"先生が同じ条件で処分される側だったら、その判断を受け入れるんですか。\n\n自分には例外を認めないと言えば済む話なのかも、よく分かりませんが。","parentId":"zouka-23","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":0,"likes":38,"views":1018,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Sixth Run","handle":"freight_16","initials":"SR","color":"#715140","avatar":"asset:zouka-avatar-02","verified":false,"id":"zouka-53","thread":"helheim-daily","time":"0d · 10:38:00","text":"Inspection done.\n\nAbout to send “just left” and actually mean it.","textJa":"検査終わった。\n\nいまから「いま出ました」を本当の意味で送ります。","parentId":"","quoteId":"","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":41,"views":1539,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"id":"zouka-a25","thread":"midgard-neighborhood","time":"0d · 10:37:00","text":"It’s just asking, isn’t it?\n\nHe speaks with his affiliation right there, but asking for their position is off limits? Convenient little badge he’s got there.","textJa":"いや、聞くだけでしょ？\n\n研究者が所属出して話してるのに、所属先の見解を聞くのはダメなん？　ずいぶん都合のいい看板だな。","parentId":"zouka-a24","quoteId":"","replyTo":"marta_seidel","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":2,"likes":14,"views":1120,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"window warm","handle":"window_warm","initials":"WW","color":"#533b29","avatar":"asset:zouka-avatar-25","verified":false,"replyTo":"","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":3,"views":618,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily17","thread":"midgard-neighborhood","time":"0d · 10:36:12","textJa":"パン屋の端っこ詰め合わせ、今日は大きい袋が出てた。昼はそれにする。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"The bakery had big bags of crusts and offcuts today. That's lunch sorted."},{"name":"Marta Seidel","handle":"marta_seidel","initials":"MS","color":"#70594a","avatar":"asset:zouka-avatar-26","verified":false,"id":"zouka-a24","thread":"midgard-neighborhood","time":"0d · 10:35:00","text":"If you encourage a flood of enquiries, Dr Enmi will not be the first person answering the phone.\n\nDo not confuse criticism of his remarks with disrupting the work of uninvolved staff.","textJa":"問い合わせを煽って最初に電話へ出るのは、遠見先生ではありません。\n\n発言への批判と、関係のない職員の仕事を止めることを混ぜないでください。","parentId":"zouka-a23","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":16,"views":2023,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Repairs Until Eight","handle":"mend_by_eight","initials":"RU","color":"#725a4c","avatar":"asset:zouka-avatar-06","verified":false,"id":"zouka-52","thread":"rooms-and-repairs","time":"0d · 10:35:00","text":"Glad it’s stopped walking.\n\nSocks are outside my area of expertise.","textJa":"歩かなくなったなら何よりです。\n\n靴下については専門外です。","parentId":"zouka-40","quoteId":"","replyTo":"oiltea_machine","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":2,"likes":13,"views":1412,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Marta Seidel","handle":"marta_seidel","initials":"MS","color":"#70594a","avatar":"asset:zouka-avatar-26","verified":false,"replyTo":"marta_seidel","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":4,"views":430,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life36","thread":"awake-and-chatting","time":"0d · 10:34:43","textJa":"移動先の会議室は誰もいませんでした。開始時間も変わっていたそうです。","parentId":"zouka-life27","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Nobody was in the new meeting room. Apparently the starting time had changed too."},{"name":"Marta Seidel","handle":"marta_seidel","initials":"MS","color":"#70594a","avatar":"asset:zouka-avatar-26","verified":false,"id":"zouka-51","thread":"enmi-fieldnotes","time":"0d · 10:33:00","text":"Dr Enmi, I suggest stating in a separate post, not only in replies, that this is your personal opinion based on public materials.\n\nBoth your explanation of the research and your political judgements could be read as the position of the institutions with which you are affiliated.","textJa":"遠見先生、公開資料に基づく個人の意見であることは、返信欄だけでなく独立した投稿にした方がよいと思います。\n\n研究上の知見を説明している部分と、政治的な判断を述べている部分の両方が、所属先の方針として読まれかねません。","parentId":"enmi-luna-assessment","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":2,"likes":18,"views":1416,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Tinderbox","handle":"feed_wick","initials":"T","color":"#7b4833","avatar":"asset:zouka-avatar-33","verified":false,"id":"zouka-a23","thread":"midgard-neighborhood","time":"0d · 10:31:00","text":"Do the “read the whole thing” crowd think paragraph four disappears if you do?\n\nWonder if his workplace knows. Got a pretty good idea of his opinion now. Hearing theirs too could liven things up nicely.","textJa":"「全文を読め」って言う人、読んだら四段落目が消えると思ってんの？\n\n所属先はこれ知ってるのかな。ご本人の意見はよく分かったので、そっちの感想もあると賑やかになりそうですねえ。","parentId":"","quoteId":"enmi-luna-assessment","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":0,"likes":18,"views":1935,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"carmine sleeve","handle":"carmine_sleeve","initials":"CS","color":"#5c1a1f","avatar":"asset:zouka-avatar-13","verified":false,"id":"zouka-50","thread":"midgard-neighborhood","time":"0d · 10:31:00","text":"He replied that he isn’t involved in that research.\n\nI don’t think that makes him responsible for the organisation. But “killing may be necessary” does carry weight when someone posts it with those credentials.","textJa":"当該研究の担当ではないって返信してた。\n\nそれで組織の責任をこの人に負わせられるとは思わないけど、肩書のついた人の「殺害も必要になりうる」は、それなりの重さで読まれると思う。","parentId":"zouka-27","quoteId":"","replyTo":"rounds_after","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":41,"views":1975,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Latch","handle":"latch_17","initials":"L","color":"#97845e","avatar":"asset:zouka-avatar-40","verified":false,"replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":9,"views":2942,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov07","thread":"enmi-fieldnotes","time":"0d · 10:30:22","textJa":"「無実でも殺していい」って広めるのが後押しになるだろ。\n\n実際に殺されてからじゃ遅いんだけど。","parentId":"zouka-prov06","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Going around saying 'it's okay to kill innocent people' encourages it.\n\nWaiting until someone actually gets killed is too late."},{"name":"Talia Reed","handle":"talia_reed","initials":"TR","color":"#765c4b","avatar":"asset:zouka-avatar-16","verified":false,"id":"zouka-49","thread":"enmi-fieldnotes","time":"0d · 10:29:00","text":"About surrendering: a family might think of asking for help before the person does.\n\nIf the person doesn’t know their own origin, you first have to find out. If asking means they’ll be killed, you avoid finding out at all.\n\nI don’t think it’s only about whether the person decides to hide.","textJa":"出頭の話、本人より先に家族が相談を考える場合もあると思います。\n\n本人が自分の由来を知らなければ、まず確かめるところからですよね。相談したら殺されると思ったら、確かめること自体を避ける。\n\n本人が隠れるかどうかだけではない気がします。","parentId":"enmi-luna-assessment","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":20,"views":1411,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Luz Ortega","handle":"luz_turns_pages","initials":"LO","color":"#866149","avatar":"asset:zouka-avatar-30","verified":false,"replyTo":"luz_turns_pages","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":7,"views":231,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily16","thread":"midgard-neighborhood","time":"0d · 10:28:46","textJa":"直りました。両面印刷だけまだ止めています。片面なら使えます。","parentId":"zouka-daily02","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"It's working again. Double-sided printing is still unavailable; single-sided is fine."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-48","thread":"enmi-fieldnotes","time":"0d · 10:27:00","text":"It should.\n\nNor does the absence of a claim to punish criminal responsibility make an examination of legal grounds and rights protections unnecessary. I have offered no judgement on the legality of the current killings.\n\nI ought to have made that qualification explicit in the original post.","textJa":"重く扱われるべきだ。\n\nまた、刑罰としての責任を問うていないからといって、法的根拠や権利保障の検討が不要になるわけでもない。私は現在の処分について、適法性の判断を示してはいない。\n\nその留保は、元の投稿にも明記しておくべきだっただろう。","parentId":"zouka-42","quoteId":"","replyTo":"rashid_mansur","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":19,"views":1996,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Eamon Quay","handle":"eamon_quay","initials":"EQ","color":"#866955","avatar":"asset:zouka-avatar-24","verified":false,"replyTo":"","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":9,"views":240,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life35","thread":"awake-and-chatting","time":"0d · 10:26:51","textJa":"午後は少し歩くつもりです。運動というほどではないけれど、用事がないと机を離れないので。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"I intend to walk a little this afternoon. Hardly exercise, but I don't leave my desk unless I have a reason to."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-a22","thread":"enmi-fieldnotes","time":"0d · 10:26:00","text":"I do not recall counting you among my allies.","textJa":"君を味方に数えた覚えはない。","parentId":"zouka-a18","quoteId":"","replyTo":"axiom_lad","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":18,"views":1447,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-47","thread":"enmi-fieldnotes","time":"0d · 10:25:00","text":"I do not object to deciding while uncertainty remains. Indeed, many decisions must be made in precisely those circumstances.\n\nBut “refusing to accept the risk” should not be read as though one could remove danger without imposing any cost. A certain loss is imposed on those who are killed.\n\nI still consider that there may be cases in which killing must be chosen. I do not agree, however, with describing that choice as merely a measure to avoid danger.","textJa":"不確実性を残したまま判断すること自体には反対しない。実際、多くの判断はそうせざるを得ないだろう。\n\nただし、「危険を引き受けない」という表現も、何の代償も負わずに危険だけを除けるかのように読まれるべきではない。殺害される側には、確実な損失が課される。\n\n私は、なお殺害を選ばねばならない場合がありうると考えている。しかし、その選択を、単に危険を避けただけの措置として説明することには賛成しない。","parentId":"zouka-41","quoteId":"","replyTo":"eamon_quay","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":2,"likes":36,"views":1784,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"folkpond","handle":"folkpond","initials":"F","color":"#344d4a","avatar":"asset:zouka-avatar-29","verified":false,"replyTo":"nessa_six","quoteExcerpt":"","replies":1,"quotes":0,"reposts":2,"likes":10,"views":639,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily15","thread":"midgard-neighborhood","time":"0d · 10:24:19","textJa":"聴いた。サビだけ急に二十年前に戻るのずるい。\n\nアルバム出るなら買う。","parentId":"zouka-daily07","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Listened. It's unfair how the chorus suddenly takes you back twenty years.\n\nIf there's an album, I'm buying it."},{"name":"Civic Rights Forum","handle":"civic_status","initials":"CR","color":"#354f56","avatar":"asset:zouka-avatar-23","verified":true,"id":"zouka-46","thread":"civic-rights-statements","time":"0d · 10:22:00","text":"To clarify:\n\nWe are not claiming that a safe method of confinement has already been established.\n\nAcknowledging that uncertainty, we still oppose the immediate killing of every individual. Responsibility for examining responses should not fall solely on those facing death.","textJa":"補足します。\n\n私たちは、現時点で安全な収容方法が確立していると主張しているわけではありません。\n\nその不確実性を認めたうえで、直ちに全個体を殺害する方針には反対しています。対処方法を検討する責任を、処分される個体だけに負わせるべきではないと考えます。","parentId":"zouka-36","quoteId":"","replyTo":"civic_status","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":1,"likes":30,"views":1563,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"two frames late","handle":"two_frames_late","initials":"TF","color":"#65584f","avatar":"asset:zouka-avatar-15","verified":false,"id":"zouka-45","thread":"late-night-matches","time":"0d · 10:20:00","text":"Pretty confident in the moves I showed on character select.","textJa":"選択画面で見せた動きには自信がある。","parentId":"zouka-37","quoteId":"","replyTo":"violet_pad","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":2,"likes":42,"views":380,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"lemon wire","handle":"lemon_wire","initials":"LW","color":"#5a7a6c","avatar":"asset:zouka-avatar-19","verified":false,"id":"zouka-a21","thread":"nibelung-report","time":"0d · 10:19:00","text":"How would I know?\n\nThrowing another suspicion at the person who just said “I don’t know” doesn’t make me know more.","textJa":"知らんよ。\n\n「分からない」って書いた相手に新しい疑惑を投げても、分かるようにはならん。","parentId":"zouka-a20","quoteId":"","replyTo":"camber_line","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":3,"likes":23,"views":1469,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"window warm","handle":"window_warm","initials":"WW","color":"#533b29","avatar":"asset:zouka-avatar-25","verified":false,"id":"zouka-44","thread":"helheim-daily","time":"0d · 10:19:00","text":"Can’t stop thinking about the ones who were just living with their families.\n\nI’m not suspicious of anyone, but I hate catching myself looking strangely at someone’s face when they come home. Closing the news.","textJa":"家族と普通に暮らしてた個体もいるってところが、ずっと頭に残ってる。\n\n誰かを疑ってるわけじゃないのに、帰ってきた人の顔を変に見てしまうのが嫌だ。ニュース閉じる。","parentId":"","quoteId":"","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":10,"views":1016,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"replyTo":"latch_17","quoteExcerpt":"","replies":1,"quotes":0,"reposts":17,"likes":74,"views":4348,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov06","thread":"enmi-fieldnotes","time":"0d · 10:18:54","textJa":"ほう、罪名まで付けてくれたのか。\n\n私の判断への反対と、私が具体的な殺人を幇助したという主張は別だよ。どの行為を指しているのかね。そこまで調べてくれたのであれば、続きを伺いたい。","parentId":"zouka-prov05","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Oh, you have even supplied the charge.\n\nOpposing my judgement and claiming that I assisted a particular murder are different matters. Which act are you referring to? If you have researched it that far, I should like to hear more."},{"name":"Eamon Quay","handle":"eamon_quay","initials":"EQ","color":"#866955","avatar":"asset:zouka-avatar-24","verified":false,"replyTo":"","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":16,"views":538,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily14","thread":"midgard-neighborhood","time":"0d · 10:18:32","textJa":"修理に出していた腕時計が戻った。買った時より箱が立派になっている。\n\n今度は落とさないようにしたい。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"My watch is back from repairs. The box is nicer than the one it originally came in.\n\nI shall try not to drop it this time."},{"name":"folkpond","handle":"folkpond","initials":"F","color":"#344d4a","avatar":"asset:zouka-avatar-29","verified":false,"replyTo":"folkpond","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":3,"views":757,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life34","thread":"awake-and-chatting","time":"0d · 10:18:06","textJa":"海老天だけ別料金って何。\n\n定額で何を揚げてくれるんだ。","parentId":"zouka-life25","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Why is shrimp tempura extra?\n\nWhat do they fry for the basic subscription?"},{"name":"Jun & Pepper","handle":"pepper_has_chair","initials":"J&","color":"#6f6457","avatar":"asset:zouka-avatar-03","verified":false,"id":"zouka-43","thread":"midgard-neighborhood","time":"0d · 10:17:00","text":"Got the old chair out.\n\nSitting in that now.\n\nThe cat is.","textJa":"前の椅子を出してきた。\n\n今はそっちに座ってる。\n\n猫が。","parentId":"zouka-9","quoteId":"","replyTo":"nessa_six","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":0,"likes":22,"views":342,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"replyTo":"doorframe_24","quoteExcerpt":"","replies":0,"quotes":1,"reposts":11,"likes":104,"views":2732,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov04","thread":"midgard-neighborhood","time":"0d · 10:16:18","textJa":"ええ、私が引き取れば安全になるとは主張していないのでね。\n\n君も危険をなくしたいのかと思っていたが、私の家に届けば満足らしい。おやおや、それなら治安の話に付き合わせて悪かった。","parentId":"zouka-prov03","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Quite: I have not claimed that taking them in would make the situation safe.\n\nI had thought you wanted the danger removed too, but apparently you would be satisfied to have it delivered to my house. My, my. I do apologise for involving you in a discussion of public safety, then."},{"name":"camber_line","handle":"camber_line","initials":"C","color":"#404832","avatar":"asset:zouka-avatar-04","verified":false,"id":"zouka-a20","thread":"nibelung-report","time":"0d · 10:15:00","text":"Then why are they keeping only the original alive?\n\nProtect the researchers’ pet, dispose of the ones that got outside? Because that’s what it looks like.","textJa":"じゃあ、元の実験体だけ残してるのは何なんだよ。\n\n研究者のお気に入りは保護します、外に出たのは処分しますってことじゃないの？　そう見えるんだけど。","parentId":"zouka-25","quoteId":"","replyTo":"lemon_wire","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":19,"views":819,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Rashid Mansur","handle":"rashid_mansur","initials":"RM","color":"#6e5b4e","avatar":"asset:zouka-avatar-10","verified":false,"id":"zouka-42","thread":"enmi-fieldnotes","time":"0d · 10:15:00","text":"I recognise that survival cannot invariably be guaranteed.\n\nThe problem arises when those assessing the danger can kill the subject before that assessment is tested. Challenging an erroneous decision afterwards restores nothing to the person killed.\n\nShould that asymmetry not carry greater weight than it does with ordinary coercive measures?","textJa":"生存という結果を必ず保障できないことは、私も承知しています。\n\n問題は、危険を判断する側が、検証される前に対象者を殺害できる場合です。事後に判断の誤りを争えても、本人には何も返せません。\n\nその非対称性は、通常の強制措置より重く扱われるべきでは。","parentId":"zouka-23","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":2,"likes":11,"views":1664,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"keelhome","handle":"keel_home","initials":"K","color":"#5e5461","avatar":"asset:zouka-avatar-07","verified":false,"replyTo":"","quoteExcerpt":"","replies":0,"quotes":0,"reposts":0,"likes":4,"views":307,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily13","thread":"helheim-daily","time":"0d · 10:13:54","textJa":"米を買った翌日に米が安くなる。二袋買うんじゃなかった。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Rice goes on sale the day after I buy it. Shouldn't have bought two bags."},{"name":"Eamon Quay","handle":"eamon_quay","initials":"EQ","color":"#866955","avatar":"asset:zouka-avatar-24","verified":false,"id":"zouka-41","thread":"enmi-fieldnotes","time":"0d · 10:12:00","text":"There are surely situations where uncertainty itself has to inform a decision.\n\nI read Theseus’s explanation less as a claim to have proved confinement impossible than as a refusal to accept the risk of choosing confinement without knowing what might happen.\n\nDo you object to that decision in itself?","textJa":"「不明」を理由に決めるしかない状況はあるでしょう。\n\nテセウスの説明は、収容不可能と証明したというより、何が起きるか分からない状態で収容を選ぶ危険を引き受けない、という意味に読めます。\n\n先生は、その判断自体にも反対ですか。","parentId":"enmi-luna-assessment","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":15,"views":843,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"little receipt","handle":"little_receipt","initials":"LR","color":"#d5735c","avatar":"asset:zouka-avatar-31","verified":false,"replyTo":"mend_by_eight","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":8,"views":568,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily12","thread":"rooms-and-repairs","time":"0d · 10:11:42","textJa":"針から探してきます。裁縫の箱はあります。","parentId":"zouka-daily06","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"I'll look for a needle first. I do have a sewing box."},{"name":"peripheral zero","handle":"peripheral_zero","initials":"PZ","color":"#25313c","avatar":"asset:zouka-avatar-22","verified":false,"id":"zouka-a19","thread":"enmi-fieldnotes","time":"0d · 10:11:00","text":"Whether someone has human rights is “fine details.” Amazing.\n\nI’m on the side that thinks action is needed, but don’t put me on your fucking team.","textJa":"人権があるかないかが「言葉の細部」なのすごいな。\n\n俺は対処が必要だと思ってる側だけど、お前と同じ側に入れられるのは嫌だわ。","parentId":"zouka-a18","quoteId":"","replyTo":"axiom_lad","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":1,"likes":39,"views":927,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","i 84f","avatar":"asset:zouka-avatar-15","verified":false,"id":"zouka-a17","thread":"late-night-matches","time":"0d · 10:05:00","text":"On a wired connection today, so we’re good.\n\nOne less excuse when I lose.","textJa":"今日は有線だから大丈夫。\n\n負けた時の言い訳が一つ減った。","parentId":"zouka-37","quoteId":"","replyTo":"violet_pad","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":29,"views":1807,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"violet_pad","handle":"violet_pad","initials":"V","color":"#2d2b81","avatar":"asset:zouka-avatar-09","verified":false,"id":"zouka-37","thread":"late-night-matches","time":"0d · 10:04:00","text":"Doesn’t count.\n\nOnly saw you on the character select screen yesterday.","textJa":"含めない。\n\n昨日のあなたは選択画面でしか見てない。","parentId":"zouka-18","quoteId":"","replyTo":"two_frames_late","quoteExcerpt":"","quoteExcerptJa":"","replies":2,"quotes":0,"reposts":2,"likes":1,"views":1036,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Sixth Run","handle":"freight_16","initials":"SR","color":"#715140","avatar":"asset:zouka-avatar-02","verified":false,"replyTo":"sora_loading","quoteExcerpt":"","replies":0,"quotes":0,"reposts":2,"likes":10,"views":288,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily10","thread":"helheim-daily","time":"0d · 10:03:38","textJa":"ある。二本目飲んでる。\n\n本日の昼飯がコーヒーになりそう。","parentId":"zouka-daily09","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Yes. On my second can.\n\nCoffee might be today's lunch."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"replyTo":"doorframe_24","quoteExcerpt":"","replies":1,"quotes":0,"reposts":10,"likes":39,"views":3919,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov02","thread":"midgard-neighborhood","time":"0d · 10:03:14","textJa":"ほう。権利を認めると、私の家に収容設備まで備わるのか。\n\n私宅なら安全に管理できるとは述べていない。危険を管理する条件が必要だという話なら、最初からしているよ。","parentId":"zouka-prov01","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Oh? Acknowledging their rights equips my house with containment facilities as well, does it?\n\nI have never said they could be safely managed in my home. If the point is that suitable conditions are needed to manage the danger, I have been making it from the outset."},{"name":"Repairs Until Eight","handle":"mend_by_eight","initials":"RU","color":"#725a4c","avatar":"asset:zouka-avatar-06","verified":false,"replyTo":"pepper_has_chair","quoteExcerpt":"","replies":1,"quotes":0,"reposts":2,"likes":9,"views":285,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life32","thread":"rooms-and-repairs","time":"0d · 10:02:56","textJa":"うちは修理だけです。引き取り処分は別の窓口になります。","parentId":"zouka-life28","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"We only do repairs. Collection for disposal is handled elsewhere."},{"name":"Civic Rights Forum","handle":"civic_status","initials":"CR","color":"#354f56","avatar":"asset:zouka-avatar-23","verified":true,"id":"zouka-36","thread":"civic-rights-statements","time":"0d · 10:02:00","text":"WE CALL FOR AN END TO THE BLANKET KILLING POLICY\n\nThe need to address the risk of external control does not mean killing individuals without considering their circumstances.\n\nWe call on Theseus to withdraw its blanket policy and examine individual risk assessments and protective measures, including isolation.\n\nThe rights of artificial humans do not apply only when those individuals can prove the absence of danger.","textJa":"【造花への一律殺害方針の撤回を求めます】\n\n外部操作の危険への対策が必要であることと、個体ごとの事情を検討せず殺害することは同義ではありません。\n\nテセウスに対し、一律殺害方針の撤回と、個別の危険評価、隔離を含む保護措置の検討を求めます。\n\n人造人間の権利は、本人が危険の不存在を証明できる場合だけに認められるものではありません。","parentId":"","quoteId":"nibelung-midgard-luna-report","replyTo":"","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":3,"reposts":89,"likes":254,"views":8344,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":true,"liked":false,"reposted":false,"bookmarked":false},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-a16","thread":"enmi-fieldnotes","time":"0d · 10:00:00","text":"In that case, you appear to have saved yourself the trouble of reading it.","textJa":"だとすれば、君は読む手間が省けたようだ。","parentId":"zouka-a11","quoteId":"","replyTo":"bent_spoon_jpg","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":2,"likes":28,"views":968,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Rashid Mansur","handle":"rashid_mansur","initials":"RM","color":"#6e5b4e","avatar":"asset:zouka-avatar-10","verified":false,"id":"zouka-35","thread":"enmi-fieldnotes","time":"0d · 10:00:00","text":"I think those matters should be distinguished.\n\nA person’s account may fail to establish safety against external control. That does not make it worthless as testimony about their life and wishes.\n\nThe current discussion frequently dismisses both together.","textJa":"そこは分けて扱うべきだと思います。\n\n本人の説明が、操作への安全性を証明しないことはあります。しかし、安全性の証明にならないからといって、その人の生活や意思についての証言としても無価値になるわけではありません。\n\n今の議論では、その二つがしばしば一緒に退けられています。","parentId":"zouka-20","quoteId":"","replyTo":"talia_reed","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":1,"likes":16,"views":1683,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Sora Dispatch","handle":"sora_loading","initials":"SD","color":"#6e5b53","avatar":"asset:zouka-avatar-05","verified":false,"replyTo":"freight_16","quoteExcerpt":"","replies":1,"quotes":0,"reposts":2,"likes":10,"views":156,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily09","thread":"helheim-daily","time":"0d · 09:58:16","textJa":"話変わるけど、そこの待機所の自販機、まだあの甘いコーヒーある？","parentId":"zouka-a05","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Changing the subject: does the vending machine in that waiting area still have that sweet coffee?"},{"name":"doorframe","handle":"doorframe_24","initials":"DF","color":"#a58743","avatar":"asset:zouka-avatar-36","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":7,"likes":50,"views":2523,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-prov01","thread":"midgard-neighborhood","time":"0d · 09:56:22","textJa":"危険物にも人権があるとかいうなら、造花は静寂先生の家に送り付けろ。","parentId":"","quoteId":"zouka-a09","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"If even dangerous objects have human rights, send the Artificial Flowers to Professor Shijima's house."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-34","thread":"enmi-fieldnotes","time":"0d · 09:56:00","text":"I have not seen unpublished research materials. Nor am I involved in that research; I am speaking on the basis of the account made public.\n\nAt the very least, the original design of the medical cells, the ability that developed in the source organism, and the Florist’s modifications cannot be grouped together as one reproducible manufacturing technology.\n\nBeyond that distinction, I cannot offer assurances founded on inside information.","textJa":"非公開の研究資料は見ていない。当該研究の担当者でもないので、公表された経緯に基づいて述べている。\n\n少なくとも、医療用細胞の当初の設計、元となった実験体に生じた異能、「花屋」側が加えた改造を、一つの再現可能な製造技術としてまとめることはできない。\n\nその区別以上のことを、私が内部情報として保証できるわけではないよ。","parentId":"zouka-21","quoteId":"","replyTo":"sana_belkacem","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":1,"likes":30,"views":351,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Rashid Mansur","handle":"rashid_mansur","initials":"RM","color":"#6e5b4e","avatar":"asset:zouka-avatar-10","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":5,"views":283,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-life31","thread":"midgard-neighborhood","time":"0d · 09:55:49","textJa":"帰りに古書市を覗く予定です。今日は閉まる前に着けそう。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"Planning to visit the second-hand book fair on the way home. I should make it before closing today."},{"name":"遠見 静寂 (Enmi Shijima)","handle":"S_Enmi_Parapsych","initials":"ES","color":"#766776","avatar":"asset:enmi-square","verified":true,"id":"zouka-33","thread":"enmi-fieldnotes","time":"0d · 09:55:00","text":"Understood. That sentence accurately states my position.","textJa":"了解した。その一文は、私の立場を正しく表している。","parentId":"zouka-31","quoteId":"","replyTo":"sparrowtube","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":0,"likes":15,"views":1202,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"carmine sleeve","handle":"carmine_sleeve","initials":"CS","color":"#5c1a1f","avatar":"asset:zouka-avatar-13","verified":false,"id":"zouka-a15","thread":"midgard-neighborhood","time":"0d · 09:54:00","text":"I oppose what he said, but I hate how much you’re enjoying it too.\n\nPeople are dying. This isn’t a fucking tasting menu.","textJa":"私はこの発言に反対だけど、あなたが喜んでるのも嫌。\n\n人が死ぬ話をしてるのに「この味」じゃないんだよ。","parentId":"zouka-a01","quoteId":"","replyTo":"feed_wick","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":0,"likes":36,"views":1470,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"carmine sleeve","handle":"carmine_sleeve","initials":"CS","color":"#5c1a1f","avatar":"asset:zouka-avatar-13","verified":false,"id":"zouka-32","thread":"midgard-neighborhood","time":"0d · 09:53:00","text":"He also says “no other way” hasn’t been established.\n\nWhat I object to is saying that, once it is, you can kill someone against their will. Concede that and you’re down to letting the people doing the killing define the conditions.","textJa":"その「他に方法がない」が確認されてない、というのも本人が書いてる。\n\nでも私が嫌なのは、確認できれば本人の意思を越えて殺してよい、というところ。そこまで認めたら、あとは殺す側が条件を定義する話になる。","parentId":"zouka-22","quoteId":"","replyTo":"smallbone_t","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":0,"likes":20,"views":1850,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"peripheral zero","handle":"peripheral_zero","initials":"PZ","color":"#25313c","avatar":"asset:zouka-avatar-22","verified":false,"replyTo":"","quoteExcerpt":"","replies":1,"quotes":0,"reposts":0,"likes":1,"views":676,"expanded":false,"notice":"","imageAlt":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false,"id":"zouka-daily08","thread":"helheim-daily","time":"0d · 09:52:43","textJa":"仕事用の靴、洗ってからちゃんと乾かしたつもりだった。\n\n歩くと中で音がする。","parentId":"","quoteId":"","quoteExcerptJa":"","image":"","imageAltJa":"","noticeJa":"","text":"I thought I'd dried my work shoes properly after washing them.\n\nThey make noises inside when I walk."},{"name":"sparrowtube","handle":"sparrowtube","initials":"S","color":"#c3baa6","avatar":"asset:zouka-avatar-12","verified":false,"id":"zouka-31","thread":"enmi-fieldnotes","time":"0d · 09:51:00","text":"“Nor do I consider that the person’s refusal, by itself, must invariably invalidate such a decision.”\n\nThat part.\n\nI didn’t say frightening because I failed to understand you.","textJa":"「本人が拒むという事実だけで、そうした判断が必ず無効になるとも考えていない」\n\nここ。\n\n怖いって言ったのは、意味が分からなかったからじゃない。","parentId":"zouka-24","quoteId":"","replyTo":"S_Enmi_Parapsych","quoteExcerpt":"","quoteExcerptJa":"","replies":1,"quotes":0,"reposts":3,"likes":32,"views":197,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"","leadBold":false,"liked":false,"reposted":false,"bookmarked":false},{"name":"Sora Dispatch","handle":"sora_loading","initials":"SD","color":"#6e5b53","avatar":"asset:zouka-avatar-05","verified":false,"id":"zouka-a14","thread":"helheim-daily","time":"0d · 09:50:00","text":"Don’t write “YOU broke the seal” on the waybill.\n\nJust saying because I can absolutely see you doing it.","textJa":"送り状に「封を切ったのはお前」って書くなよ。\n\nお前ならやりかねないから一応言っとく。","parentId":"zouka-a05","quoteId":"","replyTo":"freight_16","quoteExcerpt":"","quoteExcerptJa":"","replies":0,"quotes":0,"reposts":1,"likes":34,"views":487,"expanded":false,"notice":"","noticeJa":"","image":"","imageAlt":"","imageAltJa":"","mediaType":"image","duration":"
